<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jaidah Automotive CX Roster Planner</title>
<style>
:root{--bg:#070b14;--bg2:#0b1220;--card:rgba(17,25,40,.58);--card-soft:rgba(30,41,59,.42);--ink:#e5edf7;--muted:#9fb0c5;--line:rgba(148,163,184,.23);--nav:rgba(15,23,42,.8);--brand:#3b82f6;--ok:#86efac;--warn:#fde68a;--bad:#fecaca;--off:rgba(71,85,105,.28);--leave:rgba(180,83,9,.2);--fixed:rgba(37,99,235,.2);--work:rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:radial-gradient(1300px 720px at 10% -10%,#1f2a44 0%,transparent 60%),radial-gradient(1000px 700px at 100% 0,#12233e 0%,transparent 50%),linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-size:13px;position:relative;overflow-x:hidden}
body.light-theme{--bg:#f1f5f9;--bg2:#dbeafe;--card:rgba(255,255,255,.9);--card-soft:rgba(255,255,255,.84);--ink:#0f172a;--muted:#475569;--line:rgba(100,116,139,.25);--nav:rgba(255,255,255,.82);--brand:#2563eb;--ok:#166534;--warn:#92400e;--bad:#991b1b;--off:rgba(203,213,225,.45);--leave:rgba(251,146,60,.22);--fixed:rgba(147,197,253,.35);--work:rgba(134,239,172,.32);background:radial-gradient(1200px 700px at 0% -10%,#bfdbfe 0%,transparent 58%),radial-gradient(1000px 700px at 100% 0%,#dbeafe 0%,transparent 55%),linear-gradient(160deg,#eff6ff,#f8fafc)}
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;isolation:isolate}
.bg-orbs::before{content:'';position:absolute;inset:-20%;background:conic-gradient(from 180deg at 50% 50%,rgba(34,211,238,.08),rgba(96,165,250,.22),rgba(139,92,246,.14),rgba(34,211,238,.08));filter:blur(90px);opacity:.7;animation:spinDrift 42s linear infinite}
.bg-orbs::after{content:'';position:absolute;inset:-15%;background:repeating-linear-gradient(125deg,rgba(148,163,184,.08) 0 2px,transparent 2px 90px),repeating-linear-gradient(55deg,rgba(34,211,238,.05) 0 2px,transparent 2px 120px);mask-image:radial-gradient(circle at center,rgba(0,0,0,.9),transparent 78%);opacity:.45;transform-origin:center;animation:meshShift 34s ease-in-out infinite}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 25s infinite ease-in-out;mix-blend-mode:screen}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(96,165,250,.6),transparent 70%);top:10%;left:5%;animation-duration:28s;animation-delay:-5s}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(34,211,238,.5),transparent 70%);top:60%;right:10%;animation-duration:32s;animation-delay:-12s}
.orb3{width:600px;height:600px;background:radial-gradient(circle,rgba(139,92,246,.4),transparent 70%);bottom:15%;left:25%;animation-duration:35s;animation-delay:-20s}
.orb4{width:350px;height:350px;background:radial-gradient(circle,rgba(59,130,246,.55),transparent 70%);top:35%;right:30%;animation-duration:30s;animation-delay:-8s}
body.light-theme .orb1{background:radial-gradient(circle,rgba(37,99,235,.25),transparent 70%)}
body.light-theme .orb2{background:radial-gradient(circle,rgba(8,145,178,.22),transparent 70%)}
body.light-theme .orb3{background:radial-gradient(circle,rgba(79,70,229,.18),transparent 70%)}
body.light-theme .orb4{background:radial-gradient(circle,rgba(59,130,246,.28),transparent 70%)}
body.light-theme .bg-orbs::before{background:conic-gradient(from 180deg at 50% 50%,rgba(37,99,235,.05),rgba(14,165,233,.14),rgba(99,102,241,.08),rgba(37,99,235,.05));opacity:.85}
body.light-theme .bg-orbs::after{background:repeating-linear-gradient(125deg,rgba(100,116,139,.06) 0 2px,transparent 2px 90px),repeating-linear-gradient(55deg,rgba(37,99,235,.04) 0 2px,transparent 2px 120px);opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-50px) scale(1.1)}50%{transform:translate(-40px,30px) scale(0.95)}75%{transform:translate(50px,40px) scale(1.05)}}
@keyframes spinDrift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
@keyframes meshShift{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-3%,2%,0) scale(1.03)}66%{transform:translate3d(3%,-2%,0) scale(.98)}}
.layout,.side,.main{position:relative;z-index:1}
button,input,select,textarea{font:inherit}
body.sidebar-collapsed .side{width:72px;transform:none}
body.sidebar-collapsed .main{margin-left:72px}
body.sidebar-collapsed .brand{padding:14px 8px;text-align:center}
body.sidebar-collapsed .brand h2,
body.sidebar-collapsed .brand p,
body.sidebar-collapsed .foot,
body.sidebar-collapsed .nb .txt{display:none}
body.sidebar-collapsed .brand-head{justify-content:center}
body.sidebar-collapsed .nb{padding:11px 8px;display:flex;justify-content:center}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--nav);color:#fff;display:flex;flex-direction:column;flex-shrink:0;backdrop-filter:blur(14px);border-right:1px solid var(--line);position:fixed;left:0;top:0;bottom:0;z-index:40;transition:width .25s ease}
.brand{padding:18px 16px;border-bottom:1px solid rgba(148,163,184,.2)}
.brand-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.brand h2{font-size:16px;margin-bottom:0}.brand p{font-size:11px;color:rgba(226,232,240,.64);line-height:1.45}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:none;border:none;color:rgba(226,232,240,.75);text-align:left;cursor:pointer;font-size:12px;transition:all .2s ease}
.nb .ico{display:inline-flex;align-items:center;justify-content:center;min-width:20px;font-size:15px}
.nb.on,.nb:hover{background:rgba(59,130,246,.22);color:#fff;transform:translateX(2px)}
.foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(148,163,184,.2);font-size:11px;color:rgba(226,232,240,.55)}
.main{flex:1;display:flex;flex-direction:column;margin-left:230px;min-width:0;transition:margin-left .25s ease}
.top{background:rgba(15,23,42,.58);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.top h1{font-size:18px;margin-bottom:4px}.sub{font-size:11px;color:var(--muted)}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;width:100%;justify-content:flex-end}
.burger{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid rgba(148,163,184,.24);background:rgba(255,255,255,.06);color:inherit;border-radius:8px;cursor:pointer;transition:all .2s ease;box-shadow:none;padding:0;margin:0;flex-shrink:0}
.burger:hover{background:rgba(59,130,246,.16)}
body.light-theme .burger{color:#0f172a;background:rgba(255,255,255,.5)}
.theme-toggle{position:relative;display:inline-flex;align-items:center;background:rgba(15,23,42,.58);border:1px solid rgba(148,163,184,.28);border-radius:999px;padding:4px;gap:4px;min-width:94px;backdrop-filter:blur(10px);margin-left:auto}
.theme-toggle .thumb{position:absolute;top:4px;left:4px;width:40px;height:30px;border-radius:999px;background:linear-gradient(120deg,#facc15,#fb923c);box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .25s ease}
.theme-toggle.light .thumb{transform:translateX(0);background:linear-gradient(120deg,#facc15,#fb923c)}
.theme-toggle.dark .thumb{transform:translateX(42px);background:linear-gradient(120deg,#60a5fa,#22d3ee)}
.theme-toggle button{position:relative;z-index:1;width:40px;height:30px;border:none;background:transparent;color:#cbd5e1;border-radius:999px;cursor:pointer;font-size:15px;transition:color .2s ease,transform .2s ease}
.theme-toggle button:hover{transform:scale(1.05)}
.theme-toggle button.active{color:#fff}
.theme-toggle .moon-icon{display:inline-block;transform:scaleX(-1) rotate(-18deg)}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid rgba(148,163,184,.38);border-radius:8px;background:rgba(15,23,42,.68);color:#dbeafe;min-width:140px;transition:border-color .2s ease, box-shadow .2s ease, background .2s ease}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.18);background:rgba(15,23,42,.82)}
.field input::placeholder,.field textarea::placeholder{color:#8ba0b8}
.field select option{background:#0f172a;color:#dbeafe}
.field input[type="date"],.field input[type="month"],.field input[type="password"]{color-scheme:dark}
.agentEdit{width:100%;padding:7px 9px;border:1px solid rgba(148,163,184,.38);border-radius:8px;background:rgba(15,23,42,.68);color:#dbeafe;transition:border-color .2s ease, box-shadow .2s ease, background .2s ease}
.agentEdit:focus{outline:none;border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.18);background:rgba(15,23,42,.82)}
.agentEdit option{background:#0f172a;color:#dbeafe}
.pg{padding:18px 20px;position:relative}
#app.week-loading{pointer-events:none}
#app.week-loading .met,#app.week-loading .wc,#app.week-loading .wagent,#app.week-loading .daycard{position:relative;overflow:hidden;opacity:.56;filter:saturate(.45)}
#app.week-loading .met::after,#app.week-loading .wc::after,#app.week-loading .wagent::after,#app.week-loading .daycard::after{content:'';position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(110deg,transparent 15%,rgba(148,163,184,.22) 48%,transparent 85%);animation:weekLoadingSweep .95s linear infinite}
body.light-theme #app.week-loading .met::after,body.light-theme #app.week-loading .wc::after,body.light-theme #app.week-loading .wagent::after,body.light-theme #app.week-loading .daycard::after{background:linear-gradient(110deg,transparent 15%,rgba(59,130,246,.16) 48%,transparent 85%)}
#app.week-next{animation:weekSlideNext .42s cubic-bezier(.22,.7,.2,1)}
#app.week-prev{animation:weekSlidePrev .42s cubic-bezier(.22,.7,.2,1)}
#app.week-next .met,#app.week-next .wc,#app.week-next .wagent,#app.week-next .daycard{animation:weekCardNext .56s cubic-bezier(.22,.7,.2,1) both;animation-delay:calc(var(--wk-delay,0) * 22ms)}
#app.week-prev .met,#app.week-prev .wc,#app.week-prev .wagent,#app.week-prev .daycard{animation:weekCardPrev .56s cubic-bezier(.22,.7,.2,1) both;animation-delay:calc(var(--wk-delay,0) * 22ms)}
#app.week-fade .met > *,#app.week-fade .card > *,#app.week-fade .wc > *,#app.week-fade .wagent > *,#app.week-fade .daycard > *{animation:detailPulse .24s ease}
@keyframes weekSlideNext{0%{opacity:.1;transform:translateX(64px) scale(.988);filter:blur(2px)}65%{opacity:1;transform:translateX(-6px) scale(1.004);filter:blur(0)}100%{opacity:1;transform:translateX(0) scale(1);filter:blur(0)}}
@keyframes weekSlidePrev{0%{opacity:.1;transform:translateX(-64px) scale(.988);filter:blur(2px)}65%{opacity:1;transform:translateX(6px) scale(1.004);filter:blur(0)}100%{opacity:1;transform:translateX(0) scale(1);filter:blur(0)}}
@keyframes weekCardNext{0%{opacity:0;transform:translateX(80px) translateY(8px) scale(.97);filter:blur(2px)}70%{opacity:1;transform:translateX(-6px) translateY(0) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateX(0) translateY(0) scale(1);filter:blur(0)}}
@keyframes weekCardPrev{0%{opacity:0;transform:translateX(-80px) translateY(8px) scale(.97);filter:blur(2px)}70%{opacity:1;transform:translateX(6px) translateY(0) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateX(0) translateY(0) scale(1);filter:blur(0)}}
@keyframes detailPulse{0%{opacity:1}45%{opacity:.12;filter:blur(.4px)}100%{opacity:1;filter:blur(0)}}
@keyframes weekLoadingSweep{to{transform:translateX(120%)}}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.met:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(2,8,22,.45);border-color:rgba(96,165,250,.45)}
.met .l{font-size:11px;color:var(--muted);margin-bottom:4px}.met .v{font-size:24px;font-weight:700}.met .s{font-size:11px;color:var(--muted)}
.card{background:var(--card-soft);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.ch{font-size:14px;font-weight:700;margin-bottom:12px}
.note,.ok,.warn,.bad{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:12px;line-height:1.45;backdrop-filter:blur(8px)}
.note{background:rgba(30,58,138,.2);border:1px solid rgba(147,197,253,.34);color:#bfdbfe}
.ok{background:rgba(21,128,61,.2);border:1px solid rgba(74,222,128,.35);color:var(--ok)}
.warn{background:rgba(146,64,14,.25);border:1px solid rgba(251,191,36,.35);color:var(--warn)}
.bad{background:rgba(153,27,27,.25);border:1px solid rgba(252,165,165,.35);color:var(--bad)}
.btn{padding:8px 12px;border:1px solid rgba(148,163,184,.36);background:rgba(30,41,59,.6);color:#dbeafe;border-radius:8px;cursor:pointer;transition:all .2s ease}
.btn:hover{background:rgba(59,130,246,.24);transform:translateY(-1px)}
.btnp{background:linear-gradient(120deg,#2563eb,#0ea5e9);border-color:rgba(59,130,246,.8);color:#fff}
.btnp:hover{filter:brightness(1.08)}
.btnr{background:rgba(153,27,27,.2);border-color:rgba(252,165,165,.4);color:#fecdd3}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600}.tbl td{padding:8px;border-bottom:1px solid rgba(148,163,184,.14);vertical-align:middle}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid}.p-work{background:rgba(22,163,74,.2);color:#86efac;border-color:rgba(34,197,94,.4)}.p-fixed{background:rgba(37,99,235,.23);color:#bfdbfe;border-color:rgba(96,165,250,.45)}.p-off{background:rgba(71,85,105,.35);color:#cbd5e1;border-color:rgba(148,163,184,.35)}.p-leave{background:rgba(194,65,12,.25);color:#fed7aa;border-color:rgba(251,146,60,.35)}.p-sh1{background:rgba(37,99,235,.25);color:#bfdbfe;border-color:rgba(96,165,250,.45)}.p-sh2{background:rgba(109,40,217,.23);color:#ddd6fe;border-color:rgba(196,181,253,.4)}
.weekgrid{display:grid;grid-template-columns:220px repeat(7,minmax(120px,1fr));gap:6px;align-items:stretch}
.wh,.wc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;backdrop-filter:blur(8px)}.wh{font-size:11px;color:var(--muted);font-weight:700;text-align:center}.wc{transition:transform .2s ease,border-color .2s ease}.wc:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.4)}.wc .st{font-size:11px;font-weight:700;margin-bottom:5px}.wc .tm{font-size:11px;color:var(--muted);margin-bottom:4px}.wc .br{font-size:10px;color:#cbd5e1;line-height:1.45}
.wc .btn{position:relative;z-index:3;pointer-events:auto}
.wagent{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;backdrop-filter:blur(8px);transition:transform .2s ease,border-color .2s ease}.wagent:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.35)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#1e3a8a;color:#dbeafe;flex-shrink:0}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tight input,.tight select{min-width:auto;width:100%}
.leave-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.holiday-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr 1fr auto;gap:8px;align-items:end}
.holiday-fixed-grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:8px}
.small{font-size:11px;color:var(--muted)}
.exporttxt{width:100%;height:200px;border:1px solid rgba(148,163,184,.38);border-radius:10px;padding:10px;background:rgba(15,23,42,.72);color:#dbeafe;resize:vertical}
.exporttxt:focus{outline:none;border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
body.light-theme .top{background:rgba(255,255,255,.78);border-bottom-color:rgba(100,116,139,.2)}
body.light-theme .theme-toggle{background:rgba(255,255,255,.8);border-color:rgba(100,116,139,.25)}
body.light-theme .theme-toggle button{color:#475569}
body.light-theme .theme-toggle button.active{color:#0f172a}
body.light-theme .side{color:#0f172a;background:rgba(255,255,255,.78)}
body.light-theme .brand h2{color:#0f172a}
body.light-theme .brand p{color:#475569}
body.light-theme .foot{color:#475569}
body.light-theme .nb{color:#334155}
body.light-theme .nb.on,body.light-theme .nb:hover{background:rgba(191,219,254,.9);color:#0f172a}
body.light-theme .field input,body.light-theme .field select,body.light-theme .field textarea,body.light-theme .agentEdit,body.light-theme .exporttxt{background:rgba(255,255,255,.88);color:#0f172a;border-color:rgba(100,116,139,.35)}
body.light-theme .field input:focus,body.light-theme .field select:focus,body.light-theme .field textarea:focus,body.light-theme .agentEdit:focus,body.light-theme .exporttxt:focus{background:#fff}
body.light-theme .field select option,body.light-theme .agentEdit option{background:#fff;color:#0f172a}
body.light-theme .field input[type="date"],body.light-theme .field input[type="month"],body.light-theme .field input[type="password"]{color-scheme:light}
body.light-theme .btn{background:rgba(255,255,255,.82);color:#0f172a}
body.light-theme .note{background:rgba(219,234,254,.9);border-color:rgba(96,165,250,.35);color:#1e3a8a}
body.light-theme .ok{background:rgba(220,252,231,.95);border-color:rgba(74,222,128,.35);color:#166534}
body.light-theme .warn{background:rgba(254,249,195,.96);border-color:rgba(251,191,36,.35);color:#92400e}
body.light-theme .bad{background:rgba(254,226,226,.96);border-color:rgba(248,113,113,.35);color:#991b1b}
body.light-theme .wc .br,body.light-theme .kv{color:#1f2937}
body.light-theme .p-work{background:#dcfce7;color:#166534;border-color:#86efac}
body.light-theme .p-fixed{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
body.light-theme .p-off{background:#e2e8f0;color:#334155;border-color:#cbd5e1}
body.light-theme .p-leave{background:#ffedd5;color:#9a3412;border-color:#fdba74}
body.light-theme .p-sh1{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
body.light-theme .p-sh2{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
body.light-theme .linkbox{background:rgba(255,255,255,.84);color:#334155}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:1100px){.weekgrid{grid-template-columns:220px repeat(7,minmax(150px,1fr));overflow:auto}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.layout{display:block}.side{width:230px}.main{margin-left:72px}.grid4{grid-template-columns:1fr}.leave-grid,.holiday-grid,.holiday-fixed-grid{grid-template-columns:1fr}.top{align-items:flex-start}}

body.agent-mode .side{display:none}
body.agent-mode .top{align-items:center}
body.agent-mode .top h1{margin-bottom:0}
.linkbox{font-size:11px;color:#cbd5e1;background:rgba(15,23,42,.64);border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(8px);transition:transform .2s ease,border-color .2s ease}
.daycard:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.38)}
.daycard h4{font-size:13px;margin-bottom:8px}
.kv{font-size:12px;color:#d1d5db;line-height:1.6}
.heatmap-wrap{overflow:auto}
.heatgrid{display:grid;grid-template-columns:80px repeat(7,minmax(88px,1fr));gap:6px;min-width:760px}
.heathead,.heatlabel,.heatcell{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.heathead,.heatlabel{background:var(--card);font-weight:700}
.heathead small,.heatlabel small{display:block;color:var(--muted);font-weight:400}
.heatcell{min-height:52px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#eef6ff}
body.light-theme .heatcell{color:#0f172a}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      parsed.agents ||= JSON.parse(JSON.stringify(defaultAgents));
      parsed.leaves ||= [];

      parsed.shiftOverrides ||= {};

      parsed.selectedWeek ||= 0;
      parsed.breakOverrides ||= {};
      ensureBreakPlannerSettings(parsed);
      ensureRamadanSettings(parsed);

    }
  }catch(e){}
  return ensureRamadanSettings(ensureBreakPlannerSettings({agents:JSON.parse(JSON.stringify(defaultAgents)),leaves:[],holidays:[],weekOverrides:{},shiftOverrides:{},breakOverrides:{},month:todayMonth(),selectedWeek:0}));
}

function todayMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function humanDate(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function avatar(name){return name.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function ensureBreakPlannerSettings(obj){
  obj.breakDemand ||= {};
  obj.breakDemandMeta ||= {source:'', rows:0, days:0, uploadedAt:'', updatedAt:''};
  obj.breakFocusDate ||= '';
  obj.breakSyncVersion ||= 0;
  obj.syncVersion ||= 0;
  obj.lastUpdatedAt ||= '';
  obj.shiftOverrides ||= {};

}

}

}
function ensureRamadanSettings(obj){
  obj.ramadan ||= JSON.parse(JSON.stringify(defaultRamadan));
  obj.ramadan.names ||= {};
  obj.ramadan.times ||= {};
  obj.ramadan.names[1] ||= defaultRamadan.names[1];
  obj.ramadan.names[2] ||= defaultRamadan.names[2];
  obj.ramadan.times[1] ||= defaultRamadan.times[1];
  obj.ramadan.times[2] ||= defaultRamadan.times[2];
  obj.ramadan.agentAssignments ||= {};
  obj.ramadan.saved = !!obj.ramadan.saved;
  return obj;
}
function getRamadanShiftIds(){
  ensureRamadanSettings(state);
  const ids=[...new Set([...Object.keys(state.ramadan.names||{}), ...Object.keys(state.ramadan.times||{})])]
    .filter(Boolean)
    .sort((a,b)=>Number(a)-Number(b));
  return ids.length ? ids : ['1','2'];
}
function getNextRamadanShiftId(){
  const ids=getRamadanShiftIds().map(Number).filter(n=>!Number.isNaN(n));
  return String((ids.length ? Math.max(...ids) : 0) + 1);
}
function getSuggestedRamadanTime(){
  const ids=getRamadanShiftIds();
  const lastId=ids[ids.length-1];
  const base=splitRange((state.ramadan.times||{})[lastId] || defaultRamadan.times[2]);
  const start=parseClockMinutes(base.start || '09:00') + 30;
  const end=parseClockMinutes(base.end || '15:00') + 30;
  return rangeFromMinutes(start,end);
}
function parseClockMinutes(hm){ const [h,m]=String(hm||'00:00').split(':').map(Number); return (h||0)*60+(m||0); }
function formatClockMinutes(total){ const h=Math.floor(total/60)%24; const m=total%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function rangeFromMinutes(start,end){ return `${formatClockMinutes(start)}-${formatClockMinutes(end)}`; }
function splitRange(range){ const [start,end]=String(range||'').split('-'); return {start:start||'',end:end||''}; }
function isRamadanDate(dateStr){ const r=state.ramadan||defaultRamadan; return !!(r.enabled && r.start && r.end && dateStr>=r.start && dateStr<=r.end); }
function getRamadanAssignment(agent){ const r=state.ramadan||defaultRamadan; return String(r.agentAssignments[String(agent.id)] || 'auto'); }
function getShiftOverride(agentId,dateStr){ return state.shiftOverrides?.[`${agentId}|${dateStr}`] || ''; }
function getShiftOptionsForDate(dateStr){
  const options=[{value:'',label:'Auto from profile'}];
  if(isRamadanDate(dateStr)){
    getRamadanShiftIds().forEach(id=>{
      const name=(state.ramadan?.names?.[id] || `Ramadan Shift ${id}`);
      const time=(state.ramadan?.times?.[id] || defaultRamadan.times[2]);
      options.push({value:`ramadan:${id}`,label:`${name} · ${time}`});
    });
    options.push({value:'regular:1',label:`Regular Shift 1 · ${shiftLabel[1]}`});
    options.push({value:'regular:2',label:`Regular Shift 2 · ${shiftLabel[2]}`});
    return options;
  }
  options.push({value:'regular:1',label:`Shift 1 · ${shiftLabel[1]}`});
  options.push({value:'regular:2',label:`Shift 2 · ${shiftLabel[2]}`});
  return options;
}
function renderShiftOptions(dateStr,selectedValue=''){
  return getShiftOptionsForDate(dateStr).map(opt=>`<option value="${escapeHtml(opt.value)}" ${String(opt.value)===String(selectedValue)?'selected':''}>${escapeHtml(opt.label)}</option>`).join('');
}
function getShiftTimeInfo(agent,dateStr){
  const override=String(getShiftOverride(agent.id,dateStr) || '').trim();
  if(override){
    if(override.startsWith('ramadan:')){
      const slot=override.split(':')[1];
      const shiftIds=getRamadanShiftIds();
      if(isRamadanDate(dateStr) && shiftIds.includes(slot)){
        const name=(state.ramadan?.names?.[slot] || `Ramadan Shift ${slot}`);
        const time=(state.ramadan?.times?.[slot] || defaultRamadan.times[2]);
        return {label:`${name} · ${time}`,name,time,shift:Number(slot),ramadan:true};
      }
    }
    let regularSlot=override;
    if(override.startsWith('regular:')) regularSlot=override.split(':')[1];
    const regularShift=Number(regularSlot);
    if(shiftLabel[regularShift]) return {label:`Shift ${regularShift} · ${shiftLabel[regularShift]}`,name:`Shift ${regularShift}`,time:shiftLabel[regularShift],shift:regularShift,ramadan:false};
  }
  if(isRamadanDate(dateStr)){
    const shiftIds=getRamadanShiftIds();
    const assign=getRamadanAssignment(agent);
    let slot=(assign==='auto') ? String(agent.shift) : assign;
    if(assign!=='regular' && !shiftIds.includes(slot)) slot=shiftIds[0];
    if(assign!=='regular' && shiftIds.includes(String(slot))){
      const name=(state.ramadan?.names?.[slot] || `Ramadan Shift ${slot}`);
      const time=(state.ramadan?.times?.[slot] || defaultRamadan.times[2]);
      return {label:`${name} · ${time}`,name,time,shift:Number(slot),ramadan:true};
    }
  }
  return {label:`Shift ${agent.shift} · ${shiftLabel[agent.shift]}`,name:`Shift ${agent.shift}`,time:shiftLabel[agent.shift],shift:agent.shift,ramadan:false};
}
function getDynamicBreakTemplates(rangeStr){
  const [startTxt,endTxt]=String(rangeStr||'').split('-');
  if(!endTxt) return null;
  const start=parseClockMinutes(startTxt), end=parseClockMinutes(endTxt), total=end-start;
  if(total<300) return [[rangeFromMinutes(start+75,start+90),rangeFromMinutes(start+150,start+165),rangeFromMinutes(start+225,start+240)]];
  return [
    [rangeFromMinutes(start+90,start+105),rangeFromMinutes(start+180,start+210),rangeFromMinutes(start+270,start+285)],
    [rangeFromMinutes(start+105,start+120),rangeFromMinutes(start+195,start+225),rangeFromMinutes(start+285,start+300)],
    [rangeFromMinutes(start+120,start+135),rangeFromMinutes(start+210,start+240),rangeFromMinutes(start+300,start+315)]
  ];
}
function getBreakTemplatesForAgent(agent,dateStr){ const shiftInfo=getShiftTimeInfo(agent,dateStr); return shiftInfo.ramadan ? getDynamicBreakTemplates(shiftInfo.time) : (breakTemplates[shiftInfo.shift]||breakTemplates[1]); }
function shuffleInPlace(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function pickBalancedShift(counters,key){
  const s1=counters[1], s2=counters[2];
  if(s1.total!==s2.total) return s1.total<s2.total ? 1 : 2;
  if(s1[key]!==s2[key]) return s1[key]<s2[key] ? 1 : 2;
  return Math.random()<0.5 ? 1 : 2;
}
function autoAssignBalancedShifts(){
  const active=state.agents.filter(a=>a.active);
  const arabic=[];
  const english=[];
  active.forEach(a=>{ (/Arabic/i.test(a.lang) ? arabic : english).push(a); });
  shuffleInPlace(arabic);
  shuffleInPlace(english);
  const counters={1:{total:0,arabic:0,english:0},2:{total:0,arabic:0,english:0}};
  function assign(agent,key){
    const shift=pickBalancedShift(counters,key);
    agent.shift=shift;
    counters[shift].total++;
    counters[shift][key]++;
  }
  arabic.forEach(a=>assign(a,'arabic'));
  english.forEach(a=>assign(a,'english'));
  return {updated:active.length,counters};
}
function autoAssignRamadanByLanguage(){
  ensureRamadanSettings(state);
  const shiftIds=getRamadanShiftIds();
  const active=state.agents.filter(a=>a.active);
  const arabic=[];
  const english=[];
  active.forEach(a=>{ (/Arabic/i.test(a.lang) ? arabic : english).push(a); });
  shuffleInPlace(arabic);
  shuffleInPlace(english);
  const counters={};
  shiftIds.forEach(id=>{ counters[id]={total:0,arabic:0,english:0}; });
  function pickRamadanShift(key){
    let best=shiftIds[0];
    shiftIds.forEach(id=>{
      if(!best) best=id;
      else if(counters[id].total < counters[best].total) best=id;
      else if(counters[id].total === counters[best].total && counters[id][key] < counters[best][key]) best=id;
      else if(counters[id].total === counters[best].total && counters[id][key] === counters[best][key] && Math.random()<0.5) best=id;
    });
    return best;
  }
  function assign(agent,key){
    const shift=pickRamadanShift(key);
    state.ramadan.agentAssignments[String(agent.id)]=String(shift);
    counters[shift].total++;
    counters[shift][key]++;
  }
  arabic.forEach(a=>assign(a,'arabic'));
  english.forEach(a=>assign(a,'english'));
  state.ramadan.saved=true;
  return {updated:active.length,counters};
}
function getMonthInfo(monthStr){
  const [y,m]=monthStr.split('-').map(Number); const first=new Date(y,m-1,1); const last=new Date(y,m,0); const weeks=[];
  let start=new Date(first); while(start.getDay()!==6) start.setDate(start.getDate()-1); // back to Saturday
  while(start<=last || start.getDay()!==6 || weeks.length===0){
    const s=new Date(start); const e=new Date(start); e.setDate(e.getDate()+6); weeks.push({start:s,end:e,label:`${humanDate(s)} - ${humanDate(e)}`}); start.setDate(start.getDate()+7);
    if(start>last && start.getMonth()!==first.getMonth() && start.getDay()===6) break;
  }
  return {year:y,month:m,weeks};
}
function getSelectedWeek(){const info=getMonthInfo(state.month); if(state.selectedWeek>info.weeks.length-1) state.selectedWeek=info.weeks.length-1; if(state.selectedWeek<0) state.selectedWeek=0; return info.weeks[state.selectedWeek];}
function weekKey(start){return fmtDate(start);} 
function isArabic(agent){return /Arabic/i.test(agent.lang);} 
function normalizePreferredOff(value){ const num=Number(value); return [0,1,2,3,4,6].includes(num) ? num : -1; }
function preferredOffLabel(value){ const labels={0:'Sunday',1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',6:'Saturday'}; return labels[normalizePreferredOff(value)] || 'Not specified'; }
function preferredOffOptions(value){
  const selected=normalizePreferredOff(value);
  return `<option value="-1" ${selected===-1?'selected':''}>Not specified</option><option value="0" ${selected===0?'selected':''}>Sunday</option><option value="1" ${selected===1?'selected':''}>Monday</option><option value="2" ${selected===2?'selected':''}>Tuesday</option><option value="3" ${selected===3?'selected':''}>Wednesday</option><option value="4" ${selected===4?'selected':''}>Thursday</option><option value="6" ${selected===6?'selected':''}>Saturday</option>`;
}
function stableOffNoise(agentId,dateStr){
  const seed=`${agentId}|${dateStr}|${state.month||''}`;
  let hash=0;
  for(let i=0;i<seed.length;i++){ hash=((hash<<5)-hash)+seed.charCodeAt(i); hash|=0; }
  return Math.abs(hash%1000)/1000;
}
function getLeaveDates(agentId,start,end){
  const out=[]; let d=new Date(start); const e=new Date(end); while(d<=e){out.push(fmtDate(d)); d.setDate(d.getDate()+1);} return out;
}
function getLeaveMap(){
  const map={};
  state.leaves.forEach(l=>{getLeaveDates(l.agentId,l.start,l.end).forEach(dt=>{map[`${l.agentId}|${dt}`]=l.type||'Leave';});});
  return map;
}
function getHolidayFixedDates(holiday){
  const allowed=new Set(getLeaveDates(0,holiday.start,holiday.end));
  return [...new Set([...(holiday.fixedDates||[])].map(x=>String(x||'').trim()).filter(x=>allowed.has(x)))];
}
function getHolidayMap(baseLeaveMap){
  const map={};
  const leaveMap=baseLeaveMap || getLeaveMap();
  (state.holidays||[]).forEach((holiday,index)=>{
    if(!holiday?.start || !holiday?.end) return;
    const title=(holiday.name||`Holiday ${index+1}`).trim();
    const fixedDates=getHolidayFixedDates(holiday);
    const totalDays=getLeaveDates(0,holiday.start,holiday.end).length;
    const randomCount=Math.max(0, totalDays-fixedDates.length);
    const windowStart=new Date(holiday.start);
    const windowEnd=new Date(holiday.start);
    windowEnd.setDate(windowEnd.getDate() + ((Number(holiday.distributionWeeks)||1) * 7) - 1);
    const pool=[];
    for(let d=new Date(windowStart); d<=windowEnd; d.setDate(d.getDate()+1)){
      const ds=fmtDate(d);
      if(d.getDay()===5 || fixedDates.includes(ds)) continue;
      pool.push(ds);
    }
    activeAgents().forEach(agent=>{
      fixedDates.forEach(ds=>{
        if(!leaveMap[`${agent.id}|${ds}`]) map[`${agent.id}|${ds}`]=`${title} · fixed off`;
      });
      const ranked=pool
        .filter(ds=>!leaveMap[`${agent.id}|${ds}`])
        .map(ds=>{
          const dow=new Date(ds).getDay();
          const operationBias=(dow===4?0.2:0)+(dow===6?0.5:0)+(dow===0?0.8:0)+(dow===1?1:0)+(dow===2?1.2:0)+(dow===3?1.5:0);
          return {date:ds, score:operationBias + stableOffNoise(`${agent.id}-${index}`,ds)};
        })
        .sort((a,b)=>a.score-b.score)
        .slice(0,randomCount);
      ranked.forEach(item=>{
        if(!map[`${agent.id}|${item.date}`]) map[`${agent.id}|${item.date}`]=`${title} · distributed off`;
      });
    });
  });
  return map;
}
function activeAgents(){return state.agents.filter(a=>a.active);}
function getAgentById(id){return state.agents.find(a=>a.id===id);}
function deleteAgent(agentId){
  state.agents=state.agents.filter(a=>a.id!==agentId);
  Object.keys(state.weekOverrides||{}).forEach(wk=>{
    const wkOverrides=state.weekOverrides[wk];
    Object.keys(wkOverrides).forEach(key=>{ if(key.startsWith(agentId+'|')) delete wkOverrides[key]; });
  });
  Object.keys(state.shiftOverrides||{}).forEach(key=>{ if(key.startsWith(agentId+'|')) delete state.shiftOverrides[key]; });
  Object.keys(state.breakOverrides||{}).forEach(key=>{ if(key.startsWith(agentId+'|')) delete state.breakOverrides[key]; });
  state.leaves=(state.leaves||[]).filter(l=>l.agentId!==agentId);
  if(state.ramadan && state.ramadan.agentAssignments) delete state.ramadan.agentAssignments[agentId];
  if(state.leavePlannerData) delete state.leavePlannerData[agentId];
  markRosterSyncChange();
  saveState();
  render();
  alert(`Agent deleted successfully.`);
}

function countWeeklyLeaves(agentId,week){
  const leaveMap=getLeaveMap(); let c=0; for(let i=0;i<7;i++){ const d=new Date(week.start); d.setDate(d.getDate()+i); if(leaveMap[`${agentId}|${fmtDate(d)}`]) c++; } return c;
}
function stableWeekNoise(seed){
  let hash=0;
  for(let i=0;i<seed.length;i++){ hash=((hash<<5)-hash)+seed.charCodeAt(i); hash|=0; }
  return Math.abs(hash%1000)/1000;
}
function initOffHistoryRecord(){
  return {dayCounts:{0:0,1:0,2:0,3:0,4:0,6:0},weekendCount:0,weekly:{},monthWeekend:{}};
}
function getOffHistoryRecord(history,agentId){
  history.byAgent[agentId] ||= initOffHistoryRecord();
  return history.byAgent[agentId];
}
function monthKeyFromDate(dateStr){ return String(dateStr).slice(0,7); }
function weekStartSaturday(dateObj){
  const d=new Date(dateObj);
  while(d.getDay()!==6) d.setDate(d.getDate()-1);
  d.setHours(0,0,0,0);
  return d;
}
function countWeeklyLeavesFromMap(agentId,week,leaveMap){
  let c=0;
  for(let i=0;i<7;i++){
    const d=new Date(week.start);
    d.setDate(d.getDate()+i);
    if(leaveMap[`${agentId}|${fmtDate(d)}`]) c++;

}
function registerSecondOff(history,agentId,dateStr,wkKey){
  const rec=getOffHistoryRecord(history,agentId);
  const dow=new Date(dateStr).getDay();
  rec.dayCounts[dow]=(rec.dayCounts[dow]||0)+1;
  rec.weekly[wkKey]=dow;
  if(dow===0 || dow===6){
    rec.weekendCount++;
    const mKey=monthKeyFromDate(dateStr);
    rec.monthWeekend[mKey]=(rec.monthWeekend[mKey]||0)+1;
  }
}
function pickSecondOffDate(agent,week,leaveMap,holidayMap,history,weekLoad){
  const wkKey=weekKey(week.start);
  const prevWeekStart=new Date(week.start);
  prevWeekStart.setDate(prevWeekStart.getDate()-7);
  const prevWkKey=weekKey(prevWeekStart);
  const rec=getOffHistoryRecord(history,agent.id);
  const prevDow=rec.weekly[prevWkKey];
  const preferred=normalizePreferredOff(agent.preferredOff);
  const overrides=state.weekOverrides[wkKey]||{};
  let best=null;
  for(let i=0;i<7;i++){
    const d=new Date(week.start);
    d.setDate(d.getDate()+i);
    const dow=d.getDay();
    if(dow===5) continue; // Friday fixed off handled separately
    const ds=fmtDate(d);
    const itemKey=`${agent.id}|${ds}`;
    const ov=overrides[itemKey];
    if(leaveMap[itemKey] || holidayMap[itemKey]) continue;
    if(ov && ov.status && ov.status!=='AUTO' && ov.status!=='WORK') continue;
    const operationBias=(dow===4?0.2:0)+(dow===6?0.5:0)+(dow===0?0.8:0)+(dow===1?1:0)+(dow===2?1.2:0)+(dow===3?1.5:0);
    let score=operationBias;
    score += (weekLoad[dow]||0)*0.9;
    score += (rec.dayCounts[dow]||0)*0.55;
    if(prevDow===dow) score += 3;
    if(preferred!==-1){
      score += (dow===preferred ? -0.35 : 0.15);
    }
    const isWeekend=(dow===0 || dow===6);
    const monthKey=monthKeyFromDate(ds);
    const monthWeekendCount=rec.monthWeekend[monthKey]||0;
    if(monthWeekendCount===0){
      score += isWeekend ? -1.8 : 1.2; // ensure each agent gets a weekend off once per month when possible
    }else if(isWeekend){
      score += 0.85;
    }
    if(isWeekend) score += (rec.weekendCount||0)*0.35;
    score += stableWeekNoise(`${agent.id}|${wkKey}|${dow}`)*0.15;
    if(!best || score<best.score) best={date:ds,score,dow};
  }
  return best?best.date:null;
}
function buildSecondOffHistory(week,leaveMap,holidayMap){
  const history={byAgent:{}};
  const agents=activeAgents().slice().sort((a,b)=>a.id-b.id);
  const start=new Date(week.start);
  start.setDate(start.getDate()-(52*7));
  const cursor=weekStartSaturday(start);
  while(cursor<week.start){
    const histWeek={start:new Date(cursor), end:new Date(cursor)};
    histWeek.end.setDate(histWeek.end.getDate()+6);
    const wkLoad={0:0,1:0,2:0,3:0,4:0,6:0};
    const histWeekKey=weekKey(histWeek.start);
    agents.forEach(agent=>{
      const secondOff=pickSecondOffDate(agent,histWeek,leaveMap,holidayMap,history,wkLoad);
      if(secondOff){
        const dow=new Date(secondOff).getDay();
        wkLoad[dow]=(wkLoad[dow]||0)+1;
        registerSecondOff(history,agent.id,secondOff,histWeekKey);
      }
    });
    cursor.setDate(cursor.getDate()+7);
  }
  return history;
}
function getWeekPlan(week){
  const leaveMap=getLeaveMap();
  const holidayMap=getHolidayMap(leaveMap);
  const overrides=state.weekOverrides[weekKey(week.start)]||{};
  const history=buildSecondOffHistory(week,leaveMap,holidayMap);
  const weekLoad={0:0,1:0,2:0,3:0,4:0,6:0};
  const secondOffByAgent={};
  const monthKey=state.month;
  const orderedAgents=activeAgents().slice().sort((a,b)=>{
    const ra=getOffHistoryRecord(history,a.id);
    const rb=getOffHistoryRecord(history,b.id);
    const aMonth=ra.monthWeekend[monthKey]||0;
    const bMonth=rb.monthWeekend[monthKey]||0;
    if(aMonth!==bMonth) return aMonth-bMonth;
    if(ra.weekendCount!==rb.weekendCount) return ra.weekendCount-rb.weekendCount;
    return a.id-b.id;
  });
  const thisWeekKey=weekKey(week.start);
  orderedAgents.forEach(agent=>{
    const secondOff=pickSecondOffDate(agent,week,leaveMap,holidayMap,history,weekLoad);
    secondOffByAgent[agent.id]=secondOff;
    if(secondOff){
      const dow=new Date(secondOff).getDay();
      weekLoad[dow]=(weekLoad[dow]||0)+1;
      registerSecondOff(history,agent.id,secondOff,thisWeekKey);
    }
  });
  const plan={};
  activeAgents().forEach(agent=>{
    const secondOff=secondOffByAgent[agent.id]||null;
    for(let i=0;i<7;i++){
      const d=new Date(week.start); d.setDate(d.getDate()+i); const ds=fmtDate(d); const k=`${agent.id}|${ds}`;
      let status='WORK'; let reason='';
      if(d.getDay()===5){status='OFF'; reason='Friday fixed';}
      else if(holidayMap[k]){status='OFF'; reason=holidayMap[k];}
      else if(leaveMap[k]){status='LEAVE'; reason=leaveMap[k];}
      else if(secondOff && ds===secondOff){status='OFF'; reason='Weekly off';}
      if(overrides[k]){status=overrides[k].status; reason=overrides[k].reason||'Manual edit';}
      plan[k]={status,reason};
    }
  });
  return plan;
}
function getDaySummary(dateStr,weekPlan){
  let available=0, arabic=0, shift1=0, shift2=0, extra=0, off=0, leave=0, required=requiredByDay[new Date(dateStr).getDay()]||0;
  activeAgents().forEach(a=>{
    const p=weekPlan[`${a.id}|${dateStr}`];
    if(!p) return;
    if(p.status==='WORK'){
      const shiftInfo=getShiftTimeInfo(a,dateStr);
      available++;
      if(shiftInfo.shift===1) shift1++; else if(shiftInfo.shift===2) shift2++; else extra++;
      if(isArabic(a)) arabic++;
    }else if(p.status==='LEAVE'){
      leave++;
    }else if(p.status==='OFF'){

    }
  });
  return {available,arabic,required,gap:available-required,shift1,shift2,extra,off,leave};
}
function getBreaksForAgent(agent,workingAgentsOfShiftIndex,dateStr){
  const arr=getBreakTemplatesForAgent(agent,dateStr)||breakTemplates[agent.shift]||breakTemplates[1];
  return arr[workingAgentsOfShiftIndex%arr.length];
}
function parseRangeMinutes(r){
  const [s,e]=r.split('-');
  const [sh,sm]=s.split(':').map(Number);
  const [eh,em]=e.split(':').map(Number);
  return {start:sh*60+sm,end:eh*60+em};
}
function overlapsMinuteBlock(range,startMin,endMin){
  return range.start < endMin && range.end > startMin;
}
function hasValidBreakStructure(proposal){
  return Array.isArray(proposal) && proposal.length===3 && proposal.every(x=>typeof x==='string' && x.includes('-'));
}
function hasMaxBreakGap(proposal,maxGapMins){
  if(!hasValidBreakStructure(proposal)) return false;
  const parsed=proposal.map(parseRangeMinutes);
  return (parsed[1].start - parsed[0].end) <= maxGapMins && (parsed[2].start - parsed[1].end) <= maxGapMins;
}
function overlapsRange(a,b){ return a.start < b.end && b.start < a.end; }
function getBreakOverride(agentId,dateStr){ return state.breakOverrides[`${agentId}|${dateStr}`] || null; }
function countBreakConflicts(dateStr, weekPlan, proposal, exceptAgentId){
  const ranges=[proposal[0],proposal[1],proposal[2]].map(parseRangeMinutes);
  let count=0;
  activeAgents().forEach(agent=>{
    if(agent.id===exceptAgentId) return;
    const p=weekPlan[`${agent.id}|${dateStr}`];
    if(!p || p.status!=='WORK') return;
    const current=getBreakOverride(agent.id,dateStr) || null;
    const br=current ? [current[0],current[1],current[2]] : null;
    const fallback = br || null;
    const other=(fallback || []);
    if(!other.length) return;
    const oRanges=other.map(parseRangeMinutes);
    ranges.forEach(r=>{ oRanges.forEach(orng=>{ if(overlapsRange(r,orng)) count++; }); });
  });
  return count;
}
function getBreakDemandForDate(dateStr){ return state.breakDemand?.[dateStr] || null; }
function alignQuarter(mins){ return Math.ceil(mins/15)*15; }
function demandAtMinute(dateStr, minute){
  const hourly=getBreakDemandForDate(dateStr);
  if(!hourly) return 0;
  const key=`${pad(Math.floor(minute/60))}:00`;
  return Number(hourly[key] || 0);
}
function reserveUsage(usage, rangeTxt){
  const range=parseRangeMinutes(rangeTxt);
  for(let t=range.start;t<range.end;t+=15){ usage[t]=(usage[t]||0)+1; }
}
function syncBreakFocusDate(week){
  const dates=[];
  for(let i=0;i<7;i++){
    const d=new Date(week.start); d.setDate(d.getDate()+i);
    dates.push(fmtDate(d));
  }
  const today=fmtDate(new Date());
  if(!state.breakFocusDate || !dates.includes(state.breakFocusDate)){
    state.breakFocusDate=dates.includes(today) ? today : dates[0];
  }
  return state.breakFocusDate;
}
function formatStartFromRange(rangeTxt){ return String(rangeTxt||'').split('-')[0] || ''; }
function makeBreakProposalFromStarts(b1Start,lunchStart,b2Start){
  return [rangeFromMinutes(parseClockMinutes(b1Start), parseClockMinutes(b1Start)+15), rangeFromMinutes(parseClockMinutes(lunchStart), parseClockMinutes(lunchStart)+30), rangeFromMinutes(parseClockMinutes(b2Start), parseClockMinutes(b2Start)+15)];
}
function validateBreakProposal(agent,dateStr,proposal,weekPlan){
  if(!hasValidBreakStructure(proposal)) return 'Each working agent must have exactly 3 breaks.';
  const shift=parseRangeMinutes(getShiftTimeInfo(agent,dateStr).time);
  const parsed=proposal.map(parseRangeMinutes);
  if(parsed[0].start < shift.start || parsed[2].end > shift.end) return 'Breaks must stay inside the selected shift.';
  if(parsed[0].end > parsed[1].start || parsed[1].end > parsed[2].start) return 'The order must stay: 15 min break, 30 min lunch, 15 min break.';
  if((parsed[1].start - parsed[0].end) > 180 || (parsed[2].start - parsed[1].end) > 180) return 'The gap between consecutive breaks cannot exceed 3 hours.';
  const plans=buildBreakPlanForDate(dateStr,weekPlan);
  const slots=[];
  Object.entries(plans).forEach(([id,br])=>{ if(Number(id)!==agent.id) slots.push(...br); });
  const usage={};
  slots.forEach(r=>{ const pr=parseRangeMinutes(r); for(let t=pr.start;t<pr.end;t+=15){ usage[t]=(usage[t]||0)+1; } });
  for(const r of proposal){ const pr=parseRangeMinutes(r); for(let t=pr.start;t<pr.end;t+=15){ if((usage[t]||0)>=2) return 'This timing would put more than 2 agents on break at the same time.'; } }
  return '';
}
function pickLowestDemandRange(dateStr, fromMin, toMin, duration, usage, minAfter){
  const startAt=alignQuarter(Math.max(fromMin, minAfter || fromMin));
  let best=null;
  for(let t=startAt; t+duration<=toMin; t+=15){
    let blocked=false;
    let score=0;
    for(let m=t; m<t+duration; m+=15){
      if((usage[m]||0)>=2){ blocked=true; break; }
      score += demandAtMinute(dateStr,m) + ((usage[m]||0)*250);
    }
    if(blocked) continue;
    if(!best || score<best.score) best={start:t, score};
  }
  return best ? rangeFromMinutes(best.start,best.start+duration) : null;
}
function buildDemandAwareBreaks(agent,dateStr,usage){
  const shiftInfo=getShiftTimeInfo(agent,dateStr);
  const parsed=parseRangeMinutes(shiftInfo.time);
  const total=parsed.end-parsed.start;
  const fallback=getBreaksForAgent(agent,0,dateStr);
  if(total<240) return fallback;
  const b1=pickLowestDemandRange(dateStr, parsed.start+60, Math.min(parsed.start+180, parsed.end-180), 15, usage);
  const b1End=b1 ? parseRangeMinutes(b1).end : parsed.start+90;
  if(b1) reserveUsage(usage,b1);
  const lunchLatest=Math.min(parsed.end-90, b1End+180+30);
  const lunch=pickLowestDemandRange(dateStr, Math.max(parsed.start+150, b1End+60), lunchLatest, 30, usage, b1End+60);
  const lunchEnd=lunch ? parseRangeMinutes(lunch).end : parsed.start+240;
  if(lunch) reserveUsage(usage,lunch);
  const b2Latest=Math.min(parsed.end-30, lunchEnd+180+15);
  const b2=pickLowestDemandRange(dateStr, Math.max(parsed.start+240, lunchEnd+60), b2Latest, 15, usage, lunchEnd+60);
  if(b2) reserveUsage(usage,b2);
  const selected=[b1 || fallback[0], lunch || fallback[1], b2 || fallback[2]];
  return hasMaxBreakGap(selected,180) ? selected : fallback;
}
function buildBreakPlanForDate(dateStr,weekPlan){
  const result={};
  const usage={};
  const hasDemand=!!getBreakDemandForDate(dateStr);
  const shiftIds=[...new Set(activeAgents().map(agent=>String(getShiftTimeInfo(agent,dateStr).shift)))];
  shiftIds.forEach(shift=>{
    let idx=0;
    activeAgents().filter(agent=>String(getShiftTimeInfo(agent,dateStr).shift)===String(shift)).forEach(agent=>{
      const p=weekPlan[`${agent.id}|${dateStr}`];
      if(!p || p.status!=='WORK') return;
      const ov=getBreakOverride(agent.id,dateStr);
      if(ov && hasValidBreakStructure(ov) && hasMaxBreakGap(ov,180)){ result[agent.id]=ov; ov.forEach(x=>reserveUsage(usage,x)); return; }
      if(hasDemand){
        const selected=buildDemandAwareBreaks(agent,dateStr,usage);
        result[agent.id]=selected;
        return;
      }
      const templates=getBreakTemplatesForAgent(agent,dateStr)||breakTemplates[shift]||breakTemplates[1];
      let selected=templates[idx % templates.length];
      for(let step=0; step<templates.length; step++) {
        const cand=templates[(idx+step) % templates.length];
        if(hasValidBreakStructure(cand) && hasMaxBreakGap(cand,180) && cand.every(x=>{ const range=parseRangeMinutes(x); for(let t=range.start;t<range.end;t+=15){ if((usage[t]||0)>=2) return false; } return true; })) { selected=cand; idx=(idx+step+1); break; }
      }
      result[agent.id]=selected;
      selected.forEach(x=>reserveUsage(usage,x));
      idx++;
    });
  });
  return result;
}

function normalKey(s=''){ return String(s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function pickRowValue(row, names){
  const wanted=names.map(normalKey);
  for(const [k,v] of Object.entries(row||{})){
    const nk=normalKey(k);
    if(wanted.includes(nk) || wanted.some(w=>nk.includes(w) || w.includes(nk))) return v;
  }
  return '';
}
function parseUploadMonthValue(value){
  if(value==null || value==='') return Number((state.month||todayMonth()).split('-')[1]);
  const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
  const text=String(value).trim().toLowerCase();
  if(months[text]) return months[text];
  const num=Number(text);
  if(num>=1 && num<=12) return num;
  const dt=new Date(text);
  return Number.isNaN(dt.getTime()) ? null : (dt.getMonth()+1);
}
function parseUploadDayValue(value){
  const num=Number(value);
  if(num>=1 && num<=31) return num;
  const dt=new Date(value);
  if(!Number.isNaN(dt.getTime())) return dt.getDate();
  const match=String(value).match(/\d{1,2}/);
  return match ? Number(match[0]) : null;
}
function parseUploadHourValue(value){
  if(typeof value==='number'){
    if(value>=0 && value<=23) return `${pad(value)}:00`;
    if(value>0 && value<1){ const mins=Math.round(value*24*60); return `${pad(Math.floor(mins/60))}:00`; }
  }
  const text=String(value||'').trim();
  if(/^\d{1,2}$/.test(text)) return `${pad(Number(text))}:00`;
  const dt=new Date(`2000-01-01 ${text}`);
  if(!Number.isNaN(dt.getTime())) return `${pad(dt.getHours())}:00`;
  const match=text.match(/(\d{1,2})/);
  return match ? `${pad(Number(match[1]))}:00` : null;
}
function parseUploadDateHourValue(value){
  const text=String(value||'').trim();
  if(!text) return null;
  const normalized=text.replace(/\./g,'-').replace(/\//g,'-');
  const match=normalized.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):?(\d{2})?/);
  if(match){
    return {year:Number(match[1]),month:Number(match[2]),day:Number(match[3]),hour:`${pad(Number(match[4]))}:00`};
  }
  const dt=new Date(normalized);
  if(!Number.isNaN(dt.getTime())){
    return {year:dt.getFullYear(),month:dt.getMonth()+1,day:dt.getDate(),hour:`${pad(dt.getHours())}:00`};
  }
  return null;
}
function importBreakDemandRows(rows, fileName){
  ensureBreakPlannerSettings(state);
  const defaultYear=Number((state.month||todayMonth()).split('-')[0]);
  const demand={};
  let imported=0;
  rows.forEach(row=>{
    const combined=parseUploadDateHourValue(pickRowValue(row,['dategroupfullhour','fullhour','datetime','date time']));
    const month=combined?.month || parseUploadMonthValue(pickRowValue(row,['month']));
    const day=combined?.day || parseUploadDayValue(pickRowValue(row,['day','date']));
    const hour=combined?.hour || parseUploadHourValue(pickRowValue(row,['hour','time']));
    const year=combined?.year || defaultYear;
    const interactions=Number(pickRowValue(row,['countoffered','count - offered','number of interaction','number of interactions','interaction','interactions','volume','count']));
    if(!month || !day || !hour || Number.isNaN(interactions)) return;
    const dateStr=`${year}-${pad(month)}-${pad(day)}`;
    demand[dateStr] ||= {};
    demand[dateStr][hour]=(demand[dateStr][hour]||0)+interactions;
    imported++;
  });
  if(!imported) throw new Error('Use Interactions.csv headers like Date Group - Full Hour and Count - Offered, or Month, Day, Hour and Number of Interaction.');
  state.breakDemand=demand;
  state.breakDemandMeta={source:fileName, rows:imported, days:Object.keys(demand).length, uploadedAt:new Date().toLocaleString(), updatedAt:''};
  state.breakOverrides={};
  markBreakSyncChange();
}

async function fetchJson(url, opts={}){
  const res=await fetch(url, opts);
  let data=null;

  }

}

async function pullCloudStateIfChanged(){
  if(!cloudStatus.binId || cloudPullBusy || cloudStatus.saving) return;
  const ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  cloudPullBusy=true;
  try{
    const data=await fetchJson(`https://api.jsonbin.io/v3/b/${cloudStatus.binId}/latest`, {headers:{'X-Bin-Meta':'false'}, cache:'no-store'});
    if(data && data.agents){
      const localRaw=JSON.stringify(state);
      const remoteRaw=JSON.stringify(data);
      if(remoteRaw!==localRaw){
        state=data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        suppressNextSave=true;
        render();
      }
      cloudStatus.connected=true;
      updateCloudBanner();
    }
  }catch(err){
    cloudStatus.lastError='';
  }finally{
    cloudPullBusy=false;
  }
}
async function createCloudBin(masterKey){
  const data=await fetchJson('https://api.jsonbin.io/v3/b',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-Master-Key': masterKey,
      'X-Bin-Private':'false',
      'X-Bin-Name':'Jaidah CX Roster'
    },
    body: JSON.stringify(publicState())
  });
  return data.metadata && data.metadata.id;
}
async function saveCloudNow(){
  if(!cloudStatus.binId || !cloudStatus.masterKey) return;
  cloudStatus.saving=true;
  cloudStatus.lastError='';
  try{
    await fetchJson(`https://api.jsonbin.io/v3/b/${cloudStatus.binId}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':cloudStatus.masterKey},
      body: JSON.stringify(publicState())
    });
    cloudStatus.lastSaved=new Date().toLocaleTimeString();
    cloudStatus.connected=true;
  }catch(err){
    cloudStatus.lastError=err.message || 'Cloud save failed.';
  }finally{
    cloudStatus.saving=false;
    updateCloudBanner();
  }
}

function playWeekTransition(dir){
  const app=document.getElementById('app');
  if(!app) return;
  const items=Array.from(app.querySelectorAll('.met,.wc,.wagent,.daycard'));
  if(dir==='prev') items.reverse();
  items.forEach((el,idx)=>el.style.setProperty('--wk-delay', String(Math.min(idx,24))));
  app.classList.remove('week-next','week-prev','week-fade');
  void app.offsetWidth;
  app.classList.add(dir==='prev' ? 'week-prev' : 'week-next');
  app.classList.add('week-fade');
  setTimeout(()=>app.classList.remove('week-next','week-prev','week-fade'), 360);

function renderWithWeekLoading(dir, updateFn){
  const app=document.getElementById('app');
  if(!app){
    updateFn();
    render(dir);
    return;
  }
  const hasRosterTargets=app.querySelector('.wc,.wagent,.daycard');
  if(!hasRosterTargets){
    updateFn();
    render(dir);
    return;
  }
  const token=++weekLoadToken;
  ['monthPicker','weekPicker','prevWeek','nextWeek'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.disabled=true;
  });
  app.classList.add('week-loading');
  setTimeout(()=>{
    if(token!==weekLoadToken) return;
    updateFn();
    render(dir);
    setTimeout(()=>{
      if(token!==weekLoadToken) return;
      app.classList.remove('week-loading');
      ['monthPicker','weekPicker','prevWeek','nextWeek'].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.disabled=false;
      });
    },120);
  },170);
}

function renderBreaks(week,weekPlan){
  ensureBreakPlannerSettings(state);
  const meta=state.breakDemandMeta || {source:'', rows:0, days:0, uploadedAt:''};
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(week.start); d.setDate(d.getDate()+i);
    days.push({date:d, key:fmtDate(d)});
  }
  const focusDate=syncBreakFocusDate(week);
  const focusLabel=new Date(focusDate).toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short'});
  const hours=Array.from({length:24},(_,i)=>`${pad(i)}:00`);
  const displayMinutes=[];
  for(let h=7; h<20; h++){ for(let q=0; q<60; q+=30){ displayMinutes.push(`${pad(h)}:${pad(q)}`); } }
  let maxValue=0;
  days.forEach(day=>{ hours.forEach(hour=>{ maxValue=Math.max(maxValue, Number(state.breakDemand?.[day.key]?.[hour]||0)); }); });
  const head=['<div></div>', ...days.map(day=>`<div class="heathead">${day.date.toLocaleDateString('en-GB',{weekday:'short'})}<small>${humanDate(day.date)}</small></div>`)].join('');
  const cells=[];
  hours.forEach(hour=>{
    cells.push(`<div class="heatlabel">${hour}</div>`);
    days.forEach(day=>{
      const value=Number(state.breakDemand?.[day.key]?.[hour]||0);
      if(!value){
        cells.push('<div class="heatcell empty">–</div>');
      }else{
        const ratio=maxValue ? value/maxValue : 0;
        const bg=`rgba(${Math.round(56 + ratio*91)}, ${Math.round(130 - ratio*40)}, ${Math.round(248 - ratio*60)}, ${0.18 + ratio*0.72})`;
        cells.push(`<div class="heatcell" style="background:${bg}">${value}</div>`);

    });
  });
  const focusPlans=buildBreakPlanForDate(focusDate,weekPlan);
  const displayAgents=activeAgents();

  const firstAgent=workingAgents[0];
  const firstBreaks=firstAgent ? (focusPlans[firstAgent.id] || getBreaksForAgent(firstAgent,0,focusDate)) : ['10:00-10:15','13:00-13:30','15:30-15:45'];
  const agentGrid=['<div></div>', ...displayMinutes.map(min=>`<div class="agenthead">${min}</div>`), '<div class="agenthead">Edit</div>'];
  agentGrid.push('<div class="agentname">Break count</div>');
  displayMinutes.forEach(min=>{
    const minute=parseClockMinutes(min);
    const slotEnd=minute+30;
    let count=0;
    workingAgents.forEach(agent=>{
      const breaks=focusPlans[agent.id] || getBreaksForAgent(agent,0,focusDate);
      const ranges=[parseRangeMinutes(breaks[0]),parseRangeMinutes(breaks[1]),parseRangeMinutes(breaks[2])];
      if(ranges.some(r=>overlapsMinuteBlock(r,minute,slotEnd))) count++;
    });

      agentGrid.push('<div class="agenteditcell">—</div>');
      return;
    }
    const shiftInfo=getShiftTimeInfo(agent,focusDate);
    const breaks=focusPlans[agent.id] || getBreaksForAgent(agent,0,focusDate);
    const ranges={b1:parseRangeMinutes(breaks[0]), lunch:parseRangeMinutes(breaks[1]), b2:parseRangeMinutes(breaks[2]), shift:parseRangeMinutes(shiftInfo.time)};
    agentGrid.push(`<div class="agentname">${agent.name}<small>${shiftInfo.name} · B1 ${breaks[0]} · Lunch ${breaks[1]} · B2 ${breaks[2]}</small></div>`);
    displayMinutes.forEach(min=>{
      const minute=parseClockMinutes(min);
      const slotEnd=minute+30;
      let cls='off', label='';
      if(overlapsMinuteBlock(ranges.shift,minute,slotEnd)){ cls='work'; label='•'; }
      if(overlapsMinuteBlock(ranges.b1,minute,slotEnd)){ cls='break'; label=breaks[0]; }
      if(overlapsMinuteBlock(ranges.lunch,minute,slotEnd)){ cls='lunch'; label=breaks[1]; }

      agentGrid.push(`<div class="agentslot ${cls}">${label}</div>`);
    });
    agentGrid.push(`<div class="agenteditcell"><button class="btn editDayBreak" data-agent="${agent.id}" data-date="${focusDate}" data-b1="${formatStartFromRange(breaks[0])}" data-lunch="${formatStartFromRange(breaks[1])}" data-b2="${formatStartFromRange(breaks[2])}">Edit</button></div>`);
  });
  const uploadState=meta.rows
    ? `<div class="ok">Loaded ${meta.rows} hourly records across ${meta.days} day(s) from <strong>${escapeHtml(meta.source)}</strong>${meta.uploadedAt?` · Uploaded ${escapeHtml(meta.uploadedAt)}`:''}${meta.updatedAt?` · Synced ${escapeHtml(meta.updatedAt)}`:''}</div>`
    : `<div class="warn">Upload an Excel or CSV interaction file to see the heat map for the selected week.</div>`;
  return `

      <div class="ch">Break control · ${week.label}</div>

      ${uploadState}

    <div class="card">

      <div class="rowflex" style="margin-bottom:10px">
        <button class="btn" id="prevBreakDay">← Previous day</button>
        <button class="btn" id="nextBreakDay">Next day →</button>
        <div class="small">Choose a day, review the 30-minute layout, and see how many agents are on break at each moment.</div>
      </div>
      <div class="agentheat-wrap"><div class="agentheatgrid">${agentGrid.join('')}</div></div>
    </div>

function workingDaysInMonth2026(monthIndex){
  let count=0;
  const d=new Date(2026,monthIndex,1);
  while(d.getMonth()===monthIndex){
    if(d.getDay()!==5) count++; // exclude Friday
    d.setDate(d.getDate()+1);
  }
  return count;
}

// Entitlement table from Jaidah Leave Utilization policy (14 April 2026)
// gradeGroup: 'S' | 'senior' (P1/T1/P2/T2/M) | 'standard' (P3/T3/P4/T4)
// schedule: '5day' | '6day'  — returns [first5yrs, after5yrs]
const LP_ENT={
  S:      {'5day':[25,27],'6day':[null,null]},
  senior: {'5day':[23,25],'6day':[26,28]},
  standard:{'5day':[17,23],'6day':[20,26]}
};
function getLpEntitlement(gradeGroup,schedule,yrs){
  const row=(LP_ENT[gradeGroup]||LP_ENT.senior)[schedule]||[23,25];
  return row[yrs>=5?1:0]||23;
}

function buildLeavePlan(data){
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const TODAY_MONTH=3; // April 2026 = index 3
  const joinedIn2026=Number(data.yearJoined)===2026;
  const yrs=Number(data.yearsOfService)||0;
  const entitlement=getLpEntitlement(data.gradeGroup||'senior',data.schedule||'5day',yrs);

  let takenYtd=0;
  let lastTakenMonth=TODAY_MONTH;
  MONTHS.forEach((m,i)=>{
    const v=Number(data.taken[m])||0;
    if(v>0){ takenYtd+=v; if(i>lastTakenMonth) lastTakenMonth=i; }
  });
  takenYtd=Math.round(takenYtd*10)/10;

  // Calculate how much the employee should have accrued so far in 2026
  const today2026=new Date();
  const jan1=new Date(2026,0,1);
  const daysElapsed=Math.max(0,(today2026-jan1)/(1000*60*60*24));
  const monthsElapsed=daysElapsed/30.4375; // average calendar days per month
  const monthlyAccrual=entitlement/12;
  const accruedYtd=Math.round(monthlyAccrual*monthsElapsed*10)/10;
  // Derived carryover: balance = carryover + accrued - taken → carryover = balance - accrued + taken
  const currentBalance=Number(data.currentBalance)||0;
  const derivedCarryover=Math.round((currentBalance-accruedYtd+takenYtd)*10)/10;

  let totalRequired, fullYearPool;
  if(joinedIn2026){
    // 1 unpaid day per completed working month in 2026 (e.g. joined Feb → 11 days)
    const joinMonth0=Math.max(0,Math.min(11,Number(data.joinMonth)||0));
    totalRequired=12-joinMonth0;
    fullYearPool=0; // no paid leave for 2026 joiners in this first year
  } else {
    // Policy: annual entitlement + 12 extra working days must be used in 2026
    totalRequired=entitlement+12;
    // Total pool = derived carryover from 2025 + full 2026 annual entitlement
    fullYearPool=derivedCarryover+entitlement;
  }

  const remainingPool=Math.max(0,fullYearPool-takenYtd);
  const stillToTake=Math.max(0,totalRequired-takenYtd);
  const paidAvailable=joinedIn2026?0:Math.min(stillToTake,remainingPool);
  const unpaidNeeded=Math.max(0,stillToTake-paidAvailable);

  const planStartMonth=Math.min(11,lastTakenMonth+1);
  const planMonths=[];
  for(let i=planStartMonth;i<=11;i++) planMonths.push(i);

  let planRows=[];
  if(planMonths.length>0 && stillToTake>0){
    const n=planMonths.length;
    if(joinedIn2026){
      // 1 unpaid day per remaining month (non-consecutive policy)
      planRows=planMonths.map(m=>({month:MONTHS[m],monthIndex:m,paid:0,unpaid:1,workDays:workingDaysInMonth2026(m)}));
    } else if(data.unpaidPref==='end'&&unpaidNeeded>0){
      const uM=Math.min(Math.max(1,Math.ceil(unpaidNeeded/2)),Math.floor(n/2)||1);
      const pPM=Math.round(paidAvailable/n*10)/10;
      const uPM=Math.round(unpaidNeeded/uM*10)/10;
      planRows=planMonths.map((m,i)=>({month:MONTHS[m],monthIndex:m,paid:pPM,unpaid:i>=n-uM?uPM:0,workDays:workingDaysInMonth2026(m)}));
    } else if(data.unpaidPref==='start'&&unpaidNeeded>0){
      const uM=Math.min(Math.max(1,Math.ceil(unpaidNeeded/2)),Math.floor(n/2)||1);
      const pPM=Math.round(paidAvailable/n*10)/10;
      const uPM=Math.round(unpaidNeeded/uM*10)/10;
      planRows=planMonths.map((m,i)=>({month:MONTHS[m],monthIndex:m,paid:pPM,unpaid:i<uM?uPM:0,workDays:workingDaysInMonth2026(m)}));
    } else {
      const pPM=Math.round(paidAvailable/n*10)/10;
      const uPM=Math.round(unpaidNeeded/n*10)/10;
      planRows=planMonths.map(m=>({month:MONTHS[m],monthIndex:m,paid:pPM,unpaid:uPM,workDays:workingDaysInMonth2026(m)}));
    }
  } else if(planMonths.length>0){
    planRows=planMonths.map(m=>({month:MONTHS[m],monthIndex:m,paid:0,unpaid:0,workDays:workingDaysInMonth2026(m)}));
  }

  // Year-end balance = what paid leave remains after meeting the full requirement
  // Positive = surplus (may carry forward), Negative = deducted from December payroll
  const yearEndBalance=joinedIn2026?null:Math.round((fullYearPool-totalRequired)*10)/10;

  return {
    entitlement,totalRequired,
    takenYtd,fullYearPool:Math.round(fullYearPool*10)/10,
    remainingPool:Math.round(remainingPool*10)/10,
    stillToTake:Math.round(stillToTake*10)/10,
    paidAvailable:Math.round(paidAvailable*10)/10,
    unpaidNeeded:Math.round(unpaidNeeded*10)/10,
    yearEndBalance,
    currentBalance,accruedYtd,derivedCarryover,
    planRows,gradeGroup:data.gradeGroup,schedule:data.schedule,
    yearsOfService:yrs,joinedIn2026,carryover:derivedCarryover
  };
}

function renderLeavePlanMonthly(r){
  const MFull=['January','February','March','April','May','June','July','August','September','October','November','December'];
  if(!r.planRows.length) return `<div class="card"><div class="warn">No remaining months to plan — you have accounted for all months in the leave taken entries above.</div></div>`;
  let cumTaken=r.takenYtd;
  const tableRows=r.planRows.map(row=>{
    cumTaken=Math.round((cumTaken+row.paid+row.unpaid)*10)/10;
    const target=r.joinedIn2026?r.totalRequired:r.totalRequired;
    const remaining=Math.round((target-cumTaken)*10)/10;
    return `<tr><td>${MFull[row.monthIndex]}</td><td style="text-align:center">${row.workDays}</td><td style="text-align:center;color:var(--ok)">${row.paid>0?row.paid:'—'}</td><td style="text-align:center;color:${row.unpaid>0?'var(--bad)':'var(--muted)'}">${row.unpaid>0?row.unpaid:'—'}</td><td style="text-align:center">${cumTaken}</td><td style="text-align:center;color:${remaining<=0?'var(--ok)':'var(--muted)'}">${Math.max(0,remaining)}</td></tr>`;
  }).join('');
  const calCards=r.planRows.map(row=>{
    const total=Math.round((row.paid+row.unpaid)*10)/10;
    const pct=row.workDays>0?Math.round((total/row.workDays)*100):0;
    const col=row.unpaid>0?'var(--bad)':'var(--ok)';
    return `<div class="met" style="text-align:center"><div class="l">${MFull[row.monthIndex]}</div><div class="v" style="color:${total>0?col:'var(--muted)'}">${total>0?total:'—'}</div><div class="s">${total>0?`${pct}% of ${row.workDays} work days`:'no leave'}</div>${row.paid>0?`<div style="font-size:10px;color:var(--ok);margin-top:3px">${row.paid}d paid</div>`:''} ${row.unpaid>0?`<div style="font-size:10px;color:var(--bad)">${row.unpaid}d unpaid</div>`:''}</div>`;
  }).join('');
  return `<div class="card"><div class="ch">Recommended monthly plan</div><div class="small" style="margin-bottom:12px">${r.joinedIn2026?'One day of unpaid leave per completed working month, spread on a non-consecutive basis as recommended by the 2026 policy letter.':'Paid leave is used first each month. Unpaid days are spread according to your preference. Adjust each month as needed and rebuild the plan.'}</div><div class="rowflex" style="margin-bottom:14px"><button class="btn btnp" id="lpViewCal" type="button">Calendar</button><button class="btn" id="lpViewTable" type="button">Table</button></div><div id="lpCalView"><div class="grid4">${calCards}</div></div><div id="lpTableView" style="display:none"><table class="tbl"><thead><tr><th>Month</th><th style="text-align:center">Working Days</th><th style="text-align:center">Take (Paid)</th><th style="text-align:center">Take (Unpaid)</th><th style="text-align:center">Cumulative Taken</th><th style="text-align:center">Still Needed</th></tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
}

function overlapsWeek(l,week){
  const start=new Date(l.start);
  let end=new Date(l.end);
  if(Number(l.distributionWeeks||0)>0){
    const distributedEnd=new Date(l.start);
    distributedEnd.setDate(distributedEnd.getDate()+((Number(l.distributionWeeks)||1)*7)-1);
    if(distributedEnd>end) end=distributedEnd;
  }
  return end>=week.start && start<=week.end;
}
function setOverride(agentId,date,status,reason){

  if(status==='CLEAR' || status==='AUTO') delete state.weekOverrides[key][k]; else state.weekOverrides[key][k]={status,reason:(reason||'Manual edit')};

}

function applyWeekEdit(agentId,dateStr,status,reason,shiftValue,breakMode,b1,lunch,b2){
  if(!agentId || !dateStr) return 'Please choose an agent and date first.';
  const wk=getSelectedWeek();
  const wkKey=weekKey(wk.start);
  const itemKey=`${agentId}|${dateStr}`;
  state.weekOverrides[wkKey] ||= {};
  const prevWeek=state.weekOverrides[wkKey][itemKey] ? {...state.weekOverrides[wkKey][itemKey]} : null;
  const prevShift=state.shiftOverrides[itemKey] || '';
  const prevBreak=state.breakOverrides[itemKey] ? [...state.breakOverrides[itemKey]] : null;
  const rollback=()=>{
    state.weekOverrides[wkKey] ||= {};
    if(prevWeek) state.weekOverrides[wkKey][itemKey]=prevWeek; else delete state.weekOverrides[wkKey][itemKey];
    if(!Object.keys(state.weekOverrides[wkKey]).length) delete state.weekOverrides[wkKey];
    if(prevShift) state.shiftOverrides[itemKey]=prevShift; else delete state.shiftOverrides[itemKey];
    if(prevBreak) state.breakOverrides[itemKey]=prevBreak; else delete state.breakOverrides[itemKey];
  };
  if(status==='AUTO') delete state.weekOverrides[wkKey][itemKey];
  else state.weekOverrides[wkKey][itemKey]={status,reason:reason||'Manual edit'};
  if(!Object.keys(state.weekOverrides[wkKey]).length) delete state.weekOverrides[wkKey];
  if(status==='WORK' && shiftValue) state.shiftOverrides[itemKey]=shiftValue;
  else delete state.shiftOverrides[itemKey];
  if(status!=='WORK'){
    delete state.breakOverrides[itemKey];
    markBreakSyncChange();
    return '';
  }
  if(breakMode==='auto'){
    delete state.breakOverrides[itemKey];
    markBreakSyncChange();
    return '';
  }
  if(!b1 || !lunch || !b2){
    rollback();
    return 'Please complete all manual break start times.';
  }
  const proposal=makeBreakProposalFromStarts(b1,lunch,b2);
  const weekPlan=getWeekPlan(getSelectedWeek());
  const agent=getAgentById(agentId);
  const dayPlan=weekPlan[itemKey];
  if(!agent || !dayPlan || dayPlan.status!=='WORK'){
    rollback();
    return 'This agent is not working on that date.';
  }
  const issue=validateBreakProposal(agent,dateStr,proposal,weekPlan);
  if(issue){
    rollback();
    return issue;
  }
  state.breakOverrides[itemKey]=proposal;
  markBreakSyncChange();
  return '';
}
