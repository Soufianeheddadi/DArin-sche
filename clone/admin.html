<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jaidah Automotive CX Roster Planner</title>
<style>
:root{--bg:#070b14;--bg2:#0b1220;--card:rgba(17,25,40,.58);--card-soft:rgba(30,41,59,.42);--ink:#e5edf7;--muted:#9fb0c5;--line:rgba(148,163,184,.23);--nav:rgba(15,23,42,.8);--brand:#3b82f6;--ok:#86efac;--warn:#fde68a;--bad:#fecaca;--off:rgba(71,85,105,.28);--leave:rgba(180,83,9,.2);--fixed:rgba(37,99,235,.2);--work:rgba(22,163,74,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:radial-gradient(1300px 720px at 10% -10%,#1f2a44 0%,transparent 60%),radial-gradient(1000px 700px at 100% 0,#12233e 0%,transparent 50%),linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-size:13px}
body.light-theme{--bg:#f1f5f9;--bg2:#dbeafe;--card:rgba(255,255,255,.9);--card-soft:rgba(255,255,255,.84);--ink:#0f172a;--muted:#475569;--line:rgba(100,116,139,.25);--nav:rgba(255,255,255,.82);--brand:#2563eb;--ok:#166534;--warn:#92400e;--bad:#991b1b;--off:rgba(203,213,225,.45);--leave:rgba(251,146,60,.22);--fixed:rgba(147,197,253,.35);--work:rgba(134,239,172,.32);background:radial-gradient(1200px 700px at 0% -10%,#bfdbfe 0%,transparent 58%),radial-gradient(1000px 700px at 100% 0%,#dbeafe 0%,transparent 55%),linear-gradient(160deg,#eff6ff,#f8fafc)}
button,input,select,textarea{font:inherit}
body.sidebar-collapsed .side{width:72px;transform:none}
body.sidebar-collapsed .main{margin-left:72px}
body.sidebar-collapsed .brand{padding:14px 8px;text-align:center}
body.sidebar-collapsed .brand h2,
body.sidebar-collapsed .brand p,
body.sidebar-collapsed .foot,
body.sidebar-collapsed .nb .txt{display:none}
body.sidebar-collapsed .nb{padding:11px 8px;display:flex;justify-content:center}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--nav);color:#fff;display:flex;flex-direction:column;flex-shrink:0;backdrop-filter:blur(14px);border-right:1px solid var(--line);position:fixed;left:0;top:0;bottom:0;z-index:40;transition:width .25s ease}
.brand{padding:18px 16px;border-bottom:1px solid rgba(148,163,184,.2)}
.brand h2{font-size:16px;margin-bottom:4px}.brand p{font-size:11px;color:rgba(226,232,240,.64);line-height:1.45}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:none;border:none;color:rgba(226,232,240,.75);text-align:left;cursor:pointer;font-size:12px;transition:all .2s ease}
.nb .ico{display:inline-flex;align-items:center;justify-content:center;min-width:20px;font-size:15px}
.nb.on,.nb:hover{background:rgba(59,130,246,.22);color:#fff;transform:translateX(2px)}
.foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(148,163,184,.2);font-size:11px;color:rgba(226,232,240,.55)}
.main{flex:1;display:flex;flex-direction:column;margin-left:230px;min-width:0;transition:margin-left .25s ease}
.top{background:rgba(15,23,42,.58);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.top h1{font-size:18px;margin-bottom:4px}.sub{font-size:11px;color:var(--muted)}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;width:100%;justify-content:flex-end}
.burger{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:none;background:transparent;color:inherit;border-radius:8px;cursor:pointer;transition:all .2s ease;box-shadow:none;padding:0;margin:0}
.burger:hover{background:rgba(59,130,246,.16)}
body.light-theme .burger{color:#0f172a}
.theme-toggle{position:relative;display:inline-flex;align-items:center;background:rgba(15,23,42,.58);border:1px solid rgba(148,163,184,.28);border-radius:999px;padding:4px;gap:4px;min-width:94px;backdrop-filter:blur(10px);margin-left:auto}
.theme-toggle .thumb{position:absolute;top:4px;left:4px;width:40px;height:30px;border-radius:999px;background:linear-gradient(120deg,#facc15,#fb923c);box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .25s ease}
.theme-toggle.light .thumb{transform:translateX(0);background:linear-gradient(120deg,#facc15,#fb923c)}
.theme-toggle.dark .thumb{transform:translateX(42px);background:linear-gradient(120deg,#60a5fa,#22d3ee)}
.theme-toggle button{position:relative;z-index:1;width:40px;height:30px;border:none;background:transparent;color:#cbd5e1;border-radius:999px;cursor:pointer;font-size:15px;transition:color .2s ease,transform .2s ease}
.theme-toggle button:hover{transform:scale(1.05)}
.theme-toggle button.active{color:#fff}
.theme-toggle .moon-icon{display:inline-block;transform:scaleX(-1) rotate(-18deg)}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid rgba(148,163,184,.38);border-radius:8px;background:rgba(15,23,42,.68);color:#dbeafe;min-width:120px;transition:border-color .2s ease, box-shadow .2s ease, background .2s ease}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.18);background:rgba(15,23,42,.82)}
.field input::placeholder,.field textarea::placeholder{color:#8ba0b8}
.field select option{background:#0f172a;color:#dbeafe}
.field input[type="date"],.field input[type="month"],.field input[type="password"]{color-scheme:dark}
.agentEdit{width:100%;padding:7px 9px;border:1px solid rgba(148,163,184,.38);border-radius:8px;background:rgba(15,23,42,.68);color:#dbeafe;transition:border-color .2s ease, box-shadow .2s ease, background .2s ease}
.agentEdit:focus{outline:none;border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.18);background:rgba(15,23,42,.82)}
.agentEdit option{background:#0f172a;color:#dbeafe}
.pg{padding:18px 20px}
#app.week-next{animation:weekSlideNext .4s ease}
#app.week-prev{animation:weekSlidePrev .4s ease}
#app.week-fade .met > *,#app.week-fade .card > *,#app.week-fade .wc > *,#app.week-fade .wagent > *,#app.week-fade .daycard > *{animation:detailPulse .24s ease}
@keyframes weekSlideNext{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes weekSlidePrev{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}
@keyframes detailPulse{0%{opacity:1}45%{opacity:.12;filter:blur(.4px)}100%{opacity:1;filter:blur(0)}}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.met:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(2,8,22,.45);border-color:rgba(96,165,250,.45)}
.met .l{font-size:11px;color:var(--muted);margin-bottom:4px}.met .v{font-size:24px;font-weight:700}.met .s{font-size:11px;color:var(--muted)}
.card{background:var(--card-soft);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.ch{font-size:14px;font-weight:700;margin-bottom:12px}
.note,.ok,.warn,.bad{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:12px;line-height:1.45;backdrop-filter:blur(8px)}
.note{background:rgba(30,58,138,.2);border:1px solid rgba(147,197,253,.34);color:#bfdbfe}
.ok{background:rgba(21,128,61,.2);border:1px solid rgba(74,222,128,.35);color:var(--ok)}
.warn{background:rgba(146,64,14,.25);border:1px solid rgba(251,191,36,.35);color:var(--warn)}
.bad{background:rgba(153,27,27,.25);border:1px solid rgba(252,165,165,.35);color:var(--bad)}
.btn{padding:8px 12px;border:1px solid rgba(148,163,184,.36);background:rgba(30,41,59,.6);color:#dbeafe;border-radius:8px;cursor:pointer;transition:all .2s ease}
.btn:hover{background:rgba(59,130,246,.24);transform:translateY(-1px)}
.btnp{background:linear-gradient(120deg,#2563eb,#0ea5e9);border-color:rgba(59,130,246,.8);color:#fff}
.btnp:hover{filter:brightness(1.08)}
.btnr{background:rgba(153,27,27,.2);border-color:rgba(252,165,165,.4);color:#fecdd3}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600}.tbl td{padding:8px;border-bottom:1px solid rgba(148,163,184,.14);vertical-align:middle}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid}.p-work{background:rgba(22,163,74,.2);color:#86efac;border-color:rgba(34,197,94,.4)}.p-fixed{background:rgba(37,99,235,.23);color:#bfdbfe;border-color:rgba(96,165,250,.45)}.p-off{background:rgba(71,85,105,.35);color:#cbd5e1;border-color:rgba(148,163,184,.35)}.p-leave{background:rgba(194,65,12,.25);color:#fed7aa;border-color:rgba(251,146,60,.35)}.p-sh1{background:rgba(37,99,235,.25);color:#bfdbfe;border-color:rgba(96,165,250,.45)}.p-sh2{background:rgba(109,40,217,.23);color:#ddd6fe;border-color:rgba(196,181,253,.4)}
.weekgrid{display:grid;grid-template-columns:220px repeat(7,minmax(120px,1fr));gap:6px;align-items:stretch}
.wh,.wc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;backdrop-filter:blur(8px)}.wh{font-size:11px;color:var(--muted);font-weight:700;text-align:center}.wc{transition:transform .2s ease,border-color .2s ease}.wc:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.4)}.wc .st{font-size:11px;font-weight:700;margin-bottom:5px}.wc .tm{font-size:11px;color:var(--muted);margin-bottom:4px}.wc .br{font-size:10px;color:#cbd5e1;line-height:1.45}
.wagent{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;backdrop-filter:blur(8px);transition:transform .2s ease,border-color .2s ease}.wagent:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.35)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#1e3a8a;color:#dbeafe;flex-shrink:0}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tight input,.tight select{min-width:auto;width:100%}
.leave-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.small{font-size:11px;color:var(--muted)}
.exporttxt{width:100%;height:200px;border:1px solid rgba(148,163,184,.38);border-radius:10px;padding:10px;background:rgba(15,23,42,.72);color:#dbeafe;resize:vertical}
.exporttxt:focus{outline:none;border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
body.light-theme .top{background:rgba(255,255,255,.78);border-bottom-color:rgba(100,116,139,.2)}
body.light-theme .theme-toggle{background:rgba(255,255,255,.8);border-color:rgba(100,116,139,.25)}
body.light-theme .theme-toggle button{color:#475569}
body.light-theme .theme-toggle button.active{color:#0f172a}
body.light-theme .side{color:#0f172a;background:rgba(255,255,255,.78)}
body.light-theme .brand h2{color:#0f172a}
body.light-theme .brand p{color:#475569}
body.light-theme .foot{color:#475569}
body.light-theme .nb{color:#334155}
body.light-theme .nb.on,body.light-theme .nb:hover{background:rgba(191,219,254,.9);color:#0f172a}
body.light-theme .field input,body.light-theme .field select,body.light-theme .field textarea,body.light-theme .agentEdit,body.light-theme .exporttxt{background:rgba(255,255,255,.88);color:#0f172a;border-color:rgba(100,116,139,.35)}
body.light-theme .field input:focus,body.light-theme .field select:focus,body.light-theme .field textarea:focus,body.light-theme .agentEdit:focus,body.light-theme .exporttxt:focus{background:#fff}
body.light-theme .field select option,body.light-theme .agentEdit option{background:#fff;color:#0f172a}
body.light-theme .field input[type="date"],body.light-theme .field input[type="month"],body.light-theme .field input[type="password"]{color-scheme:light}
body.light-theme .btn{background:rgba(255,255,255,.82);color:#0f172a}
body.light-theme .note{background:rgba(219,234,254,.9);border-color:rgba(96,165,250,.35);color:#1e3a8a}
body.light-theme .ok{background:rgba(220,252,231,.95);border-color:rgba(74,222,128,.35);color:#166534}
body.light-theme .warn{background:rgba(254,249,195,.96);border-color:rgba(251,191,36,.35);color:#92400e}
body.light-theme .bad{background:rgba(254,226,226,.96);border-color:rgba(248,113,113,.35);color:#991b1b}
body.light-theme .wc .br,body.light-theme .kv{color:#1f2937}
body.light-theme .p-work{background:#dcfce7;color:#166534;border-color:#86efac}
body.light-theme .p-fixed{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
body.light-theme .p-off{background:#e2e8f0;color:#334155;border-color:#cbd5e1}
body.light-theme .p-leave{background:#ffedd5;color:#9a3412;border-color:#fdba74}
body.light-theme .p-sh1{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
body.light-theme .p-sh2{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
body.light-theme .linkbox{background:rgba(255,255,255,.84);color:#334155}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:1100px){.weekgrid{grid-template-columns:220px repeat(7,minmax(150px,1fr));overflow:auto}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.layout{display:block}.side{width:230px}.main{margin-left:72px}.grid4{grid-template-columns:1fr}.leave-grid{grid-template-columns:1fr}.top{align-items:flex-start}}

body.agent-mode .side{display:none}
body.agent-mode .top{align-items:center}
body.agent-mode .top h1{margin-bottom:0}
.linkbox{font-size:11px;color:#cbd5e1;background:rgba(15,23,42,.64);border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(8px);transition:transform .2s ease,border-color .2s ease}
.daycard:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.38)}
.daycard h4{font-size:13px;margin-bottom:8px}
.kv{font-size:12px;color:#d1d5db;line-height:1.6}
.heatmap-wrap{overflow:auto}
.heatgrid{display:grid;grid-template-columns:80px repeat(7,minmax(88px,1fr));gap:6px;min-width:760px}
.heathead,.heatlabel,.heatcell{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.heathead,.heatlabel{background:var(--card);font-weight:700}
.heathead small,.heatlabel small{display:block;color:var(--muted);font-weight:400}
.heatcell{min-height:52px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#eef6ff}
body.light-theme .heatcell{color:#0f172a}
.heatcell.empty{background:rgba(148,163,184,.12);color:var(--muted)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.legend-bar{height:10px;width:140px;border-radius:999px;background:linear-gradient(90deg,rgba(56,189,248,.18),rgba(59,130,246,.45),rgba(147,51,234,.75))}
.agentheat-wrap{overflow:auto}
.agentheatgrid{display:grid;grid-template-columns:180px repeat(26,minmax(38px,1fr)) 90px;gap:3px;min-width:1220px}
.agenthead,.agentname,.agentslot,.agenteditcell{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.agenthead,.agentname{background:var(--card);font-weight:700}
.agentslot{font-size:8px;font-weight:700;background:rgba(148,163,184,.08);line-height:1.1;word-break:break-word}
.agentslot.work{background:rgba(34,197,94,.18)}
.agentslot.break{background:rgba(56,189,248,.4)}
.agentslot.lunch{background:rgba(251,191,36,.45);color:#111827}
.agentslot.off{background:rgba(148,163,184,.08);color:var(--muted)}
.agenteditcell{background:var(--card)}

</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <h2>Jaidah Automotive</h2>
      <p>CX roster planner<br>Friday fixed off · weekly auto-plan · leave-driven edits</p>
    </div>
    <button class="nb on" data-page="dashboard"><span class="ico">🏠</span><span class="txt">Dashboard</span></button>
    <button class="nb" data-page="weekly"><span class="ico">📅</span><span class="txt">Weekly Planner</span></button>
    <button class="nb" data-page="leave"><span class="ico">🗓️</span><span class="txt">Leave Control</span></button>
    <button class="nb" data-page="breaks"><span class="ico">☕</span><span class="txt">Break Control</span></button>
    <button class="nb" data-page="team"><span class="ico">👥</span><span class="txt">Team Setup</span></button>
    <button class="nb" data-page="admin"><span class="ico">⚙️</span><span class="txt">Admin</span></button>
    <div class="foot">Built for your CX operation<br>Auto-generate first, edit only when needed</div>
  </aside>
  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <button class="burger" id="burgerToggle" aria-label="Toggle menu">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub">Selected week drives the roster. Friday is always OFF. App generates the week, you edit only where needed.</div>
        </div>
      </div>
      <div class="controls">
        <div class="field"><label>Month</label><input type="month" id="monthPicker"></div>
        <div class="field"><label>Week</label><select id="weekPicker"></select></div>
        <button class="btn" id="prevWeek">← Previous week</button>
        <button class="btn" id="nextWeek">Next week →</button>
        <div class="theme-toggle" id="themeToggle">
          <div class="thumb"></div>
          <button type="button" id="themeSun" aria-label="Light mode">☀</button>
          <button type="button" id="themeMoon" aria-label="Dark mode"><span class="moon-icon">☾</span></button>
        </div>
      </div>
    </div>
    <div class="pg" id="app"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  const text=String(value||'').trim();
  if(!text) return null;
  const normalized=text.replace(/\./g,'-').replace(/\//g,'-');
  const match=normalized.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):?(\d{2})?/);
  if(match){
    return {year:Number(match[1]),month:Number(match[2]),day:Number(match[3]),hour:`${pad(Number(match[4]))}:00`};
  }
  const dt=new Date(normalized);
  if(!Number.isNaN(dt.getTime())){
    return {year:dt.getFullYear(),month:dt.getMonth()+1,day:dt.getDate(),hour:`${pad(dt.getHours())}:00`};
  }
  return null;
}
function importBreakDemandRows(rows, fileName){
  ensureBreakPlannerSettings(state);
  const defaultYear=Number((state.month||todayMonth()).split('-')[0]);
  const demand={};
  let imported=0;
  rows.forEach(row=>{
    const combined=parseUploadDateHourValue(pickRowValue(row,['dategroupfullhour','fullhour','datetime','date time']));
    const month=combined?.month || parseUploadMonthValue(pickRowValue(row,['month']));
    const day=combined?.day || parseUploadDayValue(pickRowValue(row,['day','date']));
    const hour=combined?.hour || parseUploadHourValue(pickRowValue(row,['hour','time']));
    const year=combined?.year || defaultYear;
    const interactions=Number(pickRowValue(row,['countoffered','count - offered','number of interaction','number of interactions','interaction','interactions','volume','count']));
    if(!month || !day || !hour || Number.isNaN(interactions)) return;
    const dateStr=`${year}-${pad(month)}-${pad(day)}`;
    demand[dateStr] ||= {};
    demand[dateStr][hour]=(demand[dateStr][hour]||0)+interactions;
    imported++;
  });
  if(!imported) throw new Error('Use Interactions.csv headers like Date Group - Full Hour and Count - Offered, or Month, Day, Hour and Number of Interaction.');
  state.breakDemand=demand;
  state.breakDemandMeta={source:fileName, rows:imported, days:Object.keys(demand).length, uploadedAt:new Date().toLocaleString()};
  state.breakOverrides={};
}

async function fetchJson(url, opts={}){
  const res=await fetch(url, opts);
  let data=null;
  try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    const msg=(data && (data.message||data.error)) || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data;
}

async function pullCloudStateIfChanged(){

  const ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  cloudPullBusy=true;
  try{
    const data=await fetchJson(`https://api.jsonbin.io/v3/b/${cloudStatus.binId}/latest`, {headers:{'X-Bin-Meta':'false'}, cache:'no-store'});
    if(data && data.agents){
      const localRaw=JSON.stringify(state);
      const remoteRaw=JSON.stringify(data);
      if(remoteRaw!==localRaw){
        state=data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        suppressNextSave=true;
        render();
      }
      cloudStatus.connected=true;
      updateCloudBanner();

  }finally{

  }
}

      'Content-Type':'application/json',
      'X-Master-Key': masterKey,
      'X-Bin-Private':'false',
      'X-Bin-Name':'Jaidah CX Roster'
    },
    body: JSON.stringify(publicState())
  });
  return data.metadata && data.metadata.id;
}
async function saveCloudNow(){

  cloudStatus.saving=true;
  cloudStatus.lastError='';
  try{
    await fetchJson(`https://api.jsonbin.io/v3/b/${cloudStatus.binId}`,{
      method:'PUT',

    });

  for(let h=7; h<20; h++){ for(let q=0; q<60; q+=30){ displayMinutes.push(`${pad(h)}:${pad(q)}`); } }
  let maxValue=0;
  days.forEach(day=>{ hours.forEach(hour=>{ maxValue=Math.max(maxValue, Number(state.breakDemand?.[day.key]?.[hour]||0)); }); });
  const head=['<div></div>', ...days.map(day=>`<div class="heathead">${day.date.toLocaleDateString('en-GB',{weekday:'short'})}<small>${humanDate(day.date)}</small></div>`)].join('');

      const value=Number(state.breakDemand?.[day.key]?.[hour]||0);
      if(!value){
        cells.push('<div class="heatcell empty">–</div>');
      }else{
        const ratio=maxValue ? value/maxValue : 0;
        const bg=`rgba(${Math.round(56 + ratio*91)}, ${Math.round(130 - ratio*40)}, ${Math.round(248 - ratio*60)}, ${0.18 + ratio*0.72})`;
        cells.push(`<div class="heatcell" style="background:${bg}">${value}</div>`);

  let work=0, off=0, leave=0;
  const cards=[];
  for(let i=0;i<7;i++){
    const d=new Date(week.start); d.setDate(d.getDate()+i); const ds=fmtDate(d);
    const plan=weekPlan[`${agent.id}|${ds}`];
    const shiftInfo=getShiftTimeInfo(agent,ds);
    const breaks=plan && plan.status==='WORK' ? (buildBreakPlanForDate(ds,weekPlan)[agent.id]||[]) : [];
    if(plan?.status==='WORK') work++; else if(plan?.status==='OFF') off++; else if(plan?.status==='LEAVE') leave++;
    cards.push(`<div class="daycard"><h4>${d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}</h4>
      <div class="kv"><div>Status: <strong>${plan?plan.status:'-'}</strong></div>
      <div>${plan?.reason||''}</div>
      ${plan?.status==='WORK'?`<div>Shift: ${shiftInfo.ramadan?'Ramadan · ':''}${shiftInfo.label}</div><div>Break 1: ${breaks[0]||'-'}</div><div>Lunch: ${breaks[1]||'-'}</div><div>Break 2: ${breaks[2]||'-'}</div>`:''}
      </div></div>`);
  }
  return `<div class="grid4">
    <div class="met"><div class="l">Working days</div><div class="v">${work}</div><div class="s">selected week</div></div>
    <div class="met"><div class="l">OFF days</div><div class="v">${off}</div><div class="s">includes Friday</div></div>
    <div class="met"><div class="l">Leave days</div><div class="v">${leave}</div><div class="s">selected week</div></div>
    <div class="met"><div class="l">Base shift</div><div class="v" style="font-size:18px">${agent.shift===1?'Shift 1':'Shift 2'}</div><div class="s">${shiftLabel[agent.shift]}</div></div>
  </div>
  <div class="card"><div class="ch">${agent.name} · weekly schedule</div><div class="note">This view is for the individual agent. Any roster, leave, or break update from the planner reflects here automatically.</div><div class="daycards">${cards.join('')}</div></div>`;
}

function renderRamadan(){
  ensureRamadanSettings(state);
  const r=state.ramadan;
  const shiftIds=getRamadanShiftIds();
  const showAssignments=!!r.saved;
  const shiftRows=shiftIds.map(id=>{
    const slot=splitRange(r.times[id]);
    return `<div class="card" style="margin-top:10px">
      <div class="rowflex">
        <div class="field"><label>Shift ${id} name</label><input type="text" class="ramadanName" data-shift="${id}" value="${r.names[id]||`Ramadan Shift ${id}`}"></div>
        <div class="field"><label>Start</label><input type="time" class="ramadanStartTime" data-shift="${id}" value="${slot.start||'08:00'}"></div>
        <div class="field"><label>End</label><input type="time" class="ramadanEndTime" data-shift="${id}" value="${slot.end||'14:00'}"></div>
        ${shiftIds.length>1?`<button class="btn btnr removeRamadanShift" data-shift="${id}">Remove shift</button>`:''}
      </div>
    </div>`;
  }).join('');
  const rows=activeAgents().map(a=>`<tr>
    <td>${a.name}</td>
    <td>${a.lang}</td>
    <td><span class="pill ${a.shift===1?'p-sh1':'p-sh2'}">Regular Shift ${a.shift}</span></td>
    <td><select data-id="${a.id}" class="ramadanAssign">
      <option value="auto" ${getRamadanAssignment(a)==='auto'?'selected':''}>Auto from regular shift</option>
      ${shiftIds.map(id=>`<option value="${id}" ${getRamadanAssignment(a)===String(id)?'selected':''}>${r.names[id]} · ${r.times[id]}</option>`).join('')}
      <option value="regular" ${getRamadanAssignment(a)==='regular'?'selected':''}>Keep normal timing</option>
    </select></td>
  </tr>`).join('');
  return `
    <div class="note">Set the Ramadan shifts here, give them names, add more if you need them, then save. After saving, the agent assignment table will appear below.</div>
    <div class="rowflex">
      <div class="field"><label>Ramadan mode</label><select id="ramadanEnabled"><option value="false" ${!r.enabled?'selected':''}>Off</option><option value="true" ${r.enabled?'selected':''}>On</option></select></div>
      <div class="field"><label>Start date</label><input type="date" id="ramadanStart" value="${r.start||''}"></div>
      <div class="field"><label>End date</label><input type="date" id="ramadanEnd" value="${r.end||''}"></div>
    </div>
    ${shiftRows}
    <div class="rowflex" style="margin-top:10px">
      <button class="btn" id="addRamadanShift">Add another Ramadan shift</button>
      <button class="btn btnp" id="saveRamadan">Save Ramadan setup</button>
    </div>
    ${showAssignments ? `<div class="card" style="margin-top:12px"><div class="ch">Agent Ramadan assignment</div><div class="rowflex" style="margin-bottom:10px"><button class="btn btnp" id="autoAssignRamadan">Auto assign by language balance</button><div class="small">Randomly spreads agents between all Ramadan shifts while balancing Arabic-capable and English-only coverage.</div></div><table class="tbl"><thead><tr><th>Agent</th><th>Language</th><th>Regular shift</th><th>Ramadan shift</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="warn" style="margin-top:12px">Save the Ramadan setup first. Then the agent assignment table will appear here.</div>`}
  `;
}

function renderTeam(){
  const rows=state.agents.map(a=>`<tr><td>${a.name}</td><td><span class="pill ${a.shift===1?'p-sh1':'p-sh2'}">${a.shift===1?'Shift 1':'Shift 2'}</span></td><td>${a.lang}</td><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][a.preferredOff]}</td><td>${a.active?'<span class="pill p-work">Active</span>':'<span class="pill p-off">Inactive</span>'}</td></tr>`).join('');
  const sharedLink=currentAgentLink();
  return `<div class="card"><div class="ch">Team setup overview</div><div class="note">Preferred off day is only a planning preference. The app auto-generates the second off for each week and you can still edit exceptions.</div><table class="tbl"><thead><tr><th>Agent</th><th>Shift</th><th>Language</th><th>Preferred off</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card"><div class="ch">Shared agent portal link</div><div class="note">All agents use the same link. They select their own name after opening it.</div><div class="linkbox">${sharedLink}</div></div>`;
}
function renderAdmin(){
  const rows=state.agents.map(a=>`<tr>
    <td><input value="${a.name}" data-id="${a.id}" data-field="name" class="agentEdit"></td>
    <td><select data-id="${a.id}" data-field="shift" class="agentEdit"><option value="1" ${a.shift===1?'selected':''}>Shift 1</option><option value="2" ${a.shift===2?'selected':''}>Shift 2</option></select></td>
    <td><select data-id="${a.id}" data-field="lang" class="agentEdit"><option ${a.lang==='English'?'selected':''}>English</option><option ${a.lang==='Arabic'?'selected':''}>Arabic</option><option ${a.lang==='English/Arabic'?'selected':''}>English/Arabic</option></select></td>
    <td><select data-id="${a.id}" data-field="preferredOff" class="agentEdit">
      <option value="0" ${a.preferredOff===0?'selected':''}>Sunday</option><option value="1" ${a.preferredOff===1?'selected':''}>Monday</option><option value="2" ${a.preferredOff===2?'selected':''}>Tuesday</option><option value="3" ${a.preferredOff===3?'selected':''}>Wednesday</option><option value="4" ${a.preferredOff===4?'selected':''}>Thursday</option><option value="6" ${a.preferredOff===6?'selected':''}>Saturday</option></select></td>
    <td><select data-id="${a.id}" data-field="active" class="agentEdit"><option value="true" ${a.active?'selected':''}>Active</option><option value="false" ${!a.active?'selected':''}>Inactive</option></select></td>
  </tr>`).join('');
  const teamHtml=`<div class="note">Use this tab for your stable team setup. You can still auto-assign the regular shifts with language balance.</div><div class="rowflex" style="margin-bottom:10px"><button class="btn btnp" id="autoShiftBalance">Auto-assign shifts by language balance</button><div class="small">Randomly spreads active agents between Shift 1 and Shift 2 while balancing Arabic-capable and English-only mix.</div></div><table class="tbl"><thead><tr><th>Agent</th><th>Shift</th><th>Language</th><th>Preferred extra OFF</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  return `
    <div class="card">
      <div class="ch">Admin setup</div>
      <div class="rowflex" style="margin-bottom:12px">
        <button class="btn ${adminSubTab==='team'?'btnp':''} adminSubTab" data-sub="team">Team master data</button>
        <button class="btn ${adminSubTab==='ramadan'?'btnp':''} adminSubTab" data-sub="ramadan">Ramadan</button>
      </div>
      ${adminSubTab==='team' ? teamHtml : renderRamadan()}
    </div>
    <div class="card"><div class="ch">Data control</div><div class="rowflex"><button class="btn" id="exportJson">Export data</button><button class="btn btnr" id="resetAll">Reset all</button></div><div id="exportBox" style="margin-top:12px"></div></div>
  `;
}
function overlapsWeek(l,week){return new Date(l.end)>=week.start && new Date(l.start)<=week.end;}
function setOverride(agentId,date,status){
  const wk=getSelectedWeek(); const key=weekKey(wk.start); state.weekOverrides[key] ||= {}; const k=`${agentId}|${date}`;
  if(status==='CLEAR') delete state.weekOverrides[key][k]; else state.weekOverrides[key][k]={status,reason:'Manual edit'};
}
function bindPageActions(){
  document.querySelectorAll('.quickStatus').forEach(el=>el.onchange=(e)=>{const v=e.target.value;if(!v)return; setOverride(Number(e.target.dataset.agent),e.target.dataset.date,v); render();});
  document.querySelectorAll('.removeLeave').forEach(b=>b.onclick=()=>{state.leaves.splice(Number(b.dataset.index),1); render();});
  const addLeave=document.getElementById('addLeave'); if(addLeave) addLeave.onclick=()=>{ const agentId=Number(document.getElementById('leaveAgent').value); const start=document.getElementById('leaveStart').value; const end=document.getElementById('leaveEnd').value||start; const type=document.getElementById('leaveType').value; if(!start) return alert('Please select leave date.'); state.leaves.push({agentId,start,end,type}); render(); };
  document.querySelectorAll('.adminSubTab').forEach(el=>el.onclick=()=>{ adminSubTab=el.dataset.sub || 'team'; render(); });
  const addRamadanShift=document.getElementById('addRamadanShift');
  if(addRamadanShift) addRamadanShift.onclick=()=>{
    ensureRamadanSettings(state);
    const nextId=getNextRamadanShiftId();
    state.ramadan.names[nextId]=`Ramadan Shift ${nextId}`;
    state.ramadan.times[nextId]=getSuggestedRamadanTime();
    state.ramadan.saved=false;
    render();
  };
  document.querySelectorAll('.removeRamadanShift').forEach(el=>el.onclick=()=>{
    ensureRamadanSettings(state);
    const shiftId=String(el.dataset.shift);
    const ids=getRamadanShiftIds();
    if(ids.length<=1) return alert('At least one Ramadan shift is required.');
    delete state.ramadan.names[shiftId];
    delete state.ramadan.times[shiftId];
    Object.keys(state.ramadan.agentAssignments||{}).forEach(agentId=>{ if(state.ramadan.agentAssignments[agentId]===shiftId) delete state.ramadan.agentAssignments[agentId]; });
    state.ramadan.saved=false;
    render();
  });
  document.querySelectorAll('.ramadanAssign').forEach(el=>el.onchange=(e)=>{ ensureRamadanSettings(state); const id=String(e.target.dataset.id); const value=e.target.value; if(value==='auto') delete state.ramadan.agentAssignments[id]; else state.ramadan.agentAssignments[id]=value; saveState(); render(); });
  document.querySelectorAll('.agentEdit').forEach(el=>el.onchange=(e)=>{ const id=Number(e.target.dataset.id); const field=e.target.dataset.field; const a=state.agents.find(x=>x.id===id); if(!a || !field) return; if(field==='shift'||field==='preferredOff') a[field]=Number(e.target.value); else if(field==='active') a[field]=e.target.value==='true'; else a[field]=e.target.value; saveState(); render(); });
  const uploadBreakFile=document.getElementById('uploadBreakFile');
  if(uploadBreakFile) uploadBreakFile.onclick=async ()=>{
    const input=document.getElementById('breakFile');
    const file=input?.files?.[0];
    if(!file) return alert('Please choose the Excel file first.');
    if(typeof XLSX==='undefined') return alert('The Excel reader is still loading. Please try again.');
    try{
      const data=await file.arrayBuffer();
      const workbook=XLSX.read(data,{type:'array'});
      const sheet=workbook.Sheets[workbook.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
      importBreakDemandRows(rows,file.name);
      saveState();
      render();
    }catch(err){
      alert(err.message || 'Could not read the interaction file.');
    }
  };
  const clearBreakForecast=document.getElementById('clearBreakForecast');
  if(clearBreakForecast) clearBreakForecast.onclick=()=>{
    state.breakDemand={};
    state.breakDemandMeta={source:'', rows:0, days:0, uploadedAt:''};
    saveState();
    render();
  };
  const prevBreakDay=document.getElementById('prevBreakDay');
  if(prevBreakDay) prevBreakDay.onclick=()=>{
    const week=getSelectedWeek();
    const dates=[];
    for(let i=0;i<7;i++){ const d=new Date(week.start); d.setDate(d.getDate()+i); dates.push(fmtDate(d)); }
    let idx=Math.max(0, dates.indexOf(state.breakFocusDate));
    state.breakFocusDate=dates[Math.max(0,idx-1)];
    render();
  };
  const nextBreakDay=document.getElementById('nextBreakDay');
  if(nextBreakDay) nextBreakDay.onclick=()=>{
    const week=getSelectedWeek();
    const dates=[];
    for(let i=0;i<7;i++){ const d=new Date(week.start); d.setDate(d.getDate()+i); dates.push(fmtDate(d)); }
    let idx=Math.max(0, dates.indexOf(state.breakFocusDate));
    state.breakFocusDate=dates[Math.min(dates.length-1,idx+1)];
    render();
  };
  function fillBreakEditor(agentId,dateStr,b1,lunch,b2){
    const agentEl=document.getElementById('editBreakAgent');
    const dateEl=document.getElementById('editBreakDate');
    const b1El=document.getElementById('editBreak1');
    const lunchEl=document.getElementById('editBreakLunch');
    const b2El=document.getElementById('editBreak2');
    if(agentEl) agentEl.value=String(agentId);
    if(dateEl) dateEl.value=dateStr;
    if(b1El) b1El.value=b1 || '';
    if(lunchEl) lunchEl.value=lunch || '';
    if(b2El) b2El.value=b2 || '';
  }
  document.querySelectorAll('.editDayBreak').forEach(btn=>btn.onclick=()=>{ fillBreakEditor(btn.dataset.agent, btn.dataset.date, btn.dataset.b1, btn.dataset.lunch, btn.dataset.b2); });
  const editBreakAgent=document.getElementById('editBreakAgent');
  if(editBreakAgent) editBreakAgent.onchange=()=>{
    const dateStr=document.getElementById('editBreakDate').value;
    const agentId=Number(editBreakAgent.value);
    const weekPlan=getWeekPlan(getSelectedWeek());
    const plan=buildBreakPlanForDate(dateStr,weekPlan)[agentId] || ['10:00-10:15','13:00-13:30','15:30-15:45'];
    fillBreakEditor(agentId,dateStr,formatStartFromRange(plan[0]),formatStartFromRange(plan[1]),formatStartFromRange(plan[2]));
  };
  const saveBreakEdit=document.getElementById('saveBreakEdit');
  if(saveBreakEdit) saveBreakEdit.onclick=()=>{
    const agentId=Number(document.getElementById('editBreakAgent').value);
    const dateStr=document.getElementById('editBreakDate').value;
    const b1=document.getElementById('editBreak1').value;
    const lunch=document.getElementById('editBreakLunch').value;
    const b2=document.getElementById('editBreak2').value;
    if(!agentId || !dateStr || !b1 || !lunch || !b2) return alert('Please complete the break time fields first.');
    const proposal=makeBreakProposalFromStarts(b1,lunch,b2);
    const weekPlan=getWeekPlan(getSelectedWeek());
    const agent=getAgentById(agentId);
    const dayPlan=weekPlan[`${agentId}|${dateStr}`];
    if(!agent || !dayPlan || dayPlan.status!=='WORK') return alert('This agent is not working on that date.');
    const issue=validateBreakProposal(agent,dateStr,proposal,weekPlan);
    if(issue) return alert(issue);
    state.breakOverrides[`${agentId}|${dateStr}`]=proposal;
    saveState();
    render();
  };
  const clearBreakEdit=document.getElementById('clearBreakEdit');
  if(clearBreakEdit) clearBreakEdit.onclick=()=>{
    const agentId=Number(document.getElementById('editBreakAgent').value);
    const dateStr=document.getElementById('editBreakDate').value;
    if(!agentId || !dateStr) return;
    delete state.breakOverrides[`${agentId}|${dateStr}`];
    saveState();
    render();
  };
  const saveRamadan=document.getElementById('saveRamadan');
  if(saveRamadan) saveRamadan.onclick=()=>{
    ensureRamadanSettings(state);
    const enabled=document.getElementById('ramadanEnabled').value==='true';
    const start=document.getElementById('ramadanStart').value || '';
    const end=document.getElementById('ramadanEnd').value || '';
    if(enabled && (!start || !end)) return alert('Please choose Ramadan start and end dates.');
    const newNames={};
    const newTimes={};
    document.querySelectorAll('.ramadanName').forEach(el=>{
      const shiftId=String(el.dataset.shift);
      const startEl=document.querySelector(`.ramadanStartTime[data-shift="${shiftId}"]`);
      const endEl=document.querySelector(`.ramadanEndTime[data-shift="${shiftId}"]`);
      const shiftName=(el.value || `Ramadan Shift ${shiftId}`).trim();
      const shiftStart=(startEl && startEl.value) || '08:00';
      const shiftEnd=(endEl && endEl.value) || '14:00';
      newNames[shiftId]=shiftName;
      newTimes[shiftId]=`${shiftStart}-${shiftEnd}`;
    });
    state.ramadan.enabled=enabled;
    state.ramadan.start=start;
    state.ramadan.end=end;
    state.ramadan.names=newNames;
    state.ramadan.times=newTimes;
    state.ramadan.saved=true;
    saveState();
    render();
  };
  const autoAssignRamadan=document.getElementById('autoAssignRamadan');
  if(autoAssignRamadan) autoAssignRamadan.onclick=()=>{
    const result=autoAssignRamadanByLanguage();
    const details=Object.keys(result.counters).map(id=>{
      const slotName=(state.ramadan.names||{})[id] || `Ramadan Shift ${id}`;
      const c=result.counters[id];
      return `${slotName}: ${c.total} total (${c.arabic} Arabic-capable, ${c.english} English-only)`;
    }).join('\n');
    saveState();
    render();
    alert(`Auto-assigned ${result.updated} active agents for Ramadan.\n${details}`);
  };
  const autoShiftBalance=document.getElementById('autoShiftBalance');
  if(autoShiftBalance) autoShiftBalance.onclick=()=>{
    const result=autoAssignBalancedShifts();
    render();
    alert(
      `Auto-assigned ${result.updated} active agents.\n`+
      `Shift 1: ${result.counters[1].total} total (${result.counters[1].arabic} Arabic-capable, ${result.counters[1].english} English-only)\n`+
      `Shift 2: ${result.counters[2].total} total (${result.counters[2].arabic} Arabic-capable, ${result.counters[2].english} English-only)`
    );
  };
  const saveOverride=document.getElementById('saveOverride'); if(saveOverride) saveOverride.onclick=()=>{const agentId=Number(document.getElementById('ovAgent').value); const date=document.getElementById('ovDate').value; const status=document.getElementById('ovStatus').value; if(!date) return alert('Choose date first.'); setOverride(agentId,date,status); render();};

  const cloudInput=document.getElementById('cloudMasterKey');
  if(cloudInput) cloudInput.value=cloudStatus.masterKey || '';
  const connectCloud=document.getElementById('connectCloud');
  if(connectCloud) connectCloud.onclick=async ()=>{
    const key=(document.getElementById('cloudMasterKey').value || '').trim();
    if(!key) return alert('Paste your JSONBin Master Key first.');
    cloudStatus.masterKey=key;
    localStorage.setItem(CLOUD_MASTER_KEY, key);
    try{
      if(!cloudStatus.binId){
        const newBinId=await createCloudBin(key);
        cloudStatus.binId=newBinId;
        applyBinToUrl(newBinId);
      }
      await saveCloudNow();
      render();
    }catch(err){
      cloudStatus.lastError=err.message || 'Could not connect cloud.';
      updateCloudBanner();
      alert(cloudStatus.lastError);
    }
  };
  const loadCloud=document.getElementById('loadCloud');
  if(loadCloud) loadCloud.onclick=async ()=>{
    if(!cloudStatus.binId) return alert('Open the admin link that contains ?bin=... or connect cloud first.');
    try{
      await loadCloudState(cloudStatus.binId);
      render();
    }catch(err){
      cloudStatus.lastError=err.message || 'Could not load cloud data.';
      updateCloudBanner();
      alert(cloudStatus.lastError);
    }
  };
  const exportBtn=document.getElementById('exportJson'); if(exportBtn) exportBtn.onclick=()=>{document.getElementById('exportBox').innerHTML=`<textarea class="exporttxt">${JSON.stringify(state,null,2)}</textarea>`;};
  const resetBtn=document.getElementById('resetAll'); if(resetBtn) resetBtn.onclick=()=>{ if(confirm('Reset all saved data?')){ localStorage.removeItem(STORAGE_KEY); state=loadState(); render(); } };
  const moon=document.getElementById('themeMoon'); if(moon) moon.onclick=()=>setTheme('dark');
  const sun=document.getElementById('themeSun'); if(sun) sun.onclick=()=>setTheme('light');
  const burgerToggle=document.getElementById('burgerToggle');
  if(burgerToggle) burgerToggle.onclick=()=>{
    document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('jaidah_sidebar_collapsed_v1', document.body.classList.contains('sidebar-collapsed') ? 'true' : 'false');
  };
}

window.addEventListener('storage', e=>{
  if(e.key===STORAGE_KEY){ state=loadState(); render(); }
  if(e.key===THEME_KEY){ applyTheme(currentTheme()); }
});
window.addEventListener('focus', ()=>{ pullCloudStateIfChanged(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullCloudStateIfChanged(); });
setInterval(()=>{ pullCloudStateIfChanged(); }, 8000);

document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page; render();});
document.getElementById('monthPicker').onchange=e=>{state.month=e.target.value; state.selectedWeek=0; render('next');};
document.getElementById('weekPicker').onchange=e=>{const prev=state.selectedWeek; state.selectedWeek=Number(e.target.value); render(state.selectedWeek<prev?'prev':'next');};
document.getElementById('prevWeek').onclick=()=>{state.selectedWeek=Math.max(0,state.selectedWeek-1); render('prev');};
document.getElementById('nextWeek').onclick=()=>{const max=getMonthInfo(state.month).weeks.length-1; state.selectedWeek=Math.min(max,state.selectedWeek+1); render('next');};
(async function initCloud(){
  if(BIN_PARAM){
    try{ await loadCloudState(BIN_PARAM); }catch(err){ cloudStatus.lastError=err.message || 'Could not load cloud data.'; }
  }
  render();
})();
</script>
</body>
</html>
